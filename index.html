<script id="vaultLayer">
/* لایه‌ی قفل و رمزگذاری — قبل از اجرای برنامه اجرا می‌شود.
   اطلاعات با AES-GCM و کلیدی که از رمز کاربر با PBKDF2 ساخته می‌شود روی همین دستگاه رمزگذاری می‌شود.
   رمز هیچ‌جا ذخیره نمی‌شود. */
(function(){
  'use strict';
  const OWNER = 'مهندس فرشاد';          // نام صاحب حق نشر — اینجا قابل تغییر است
  const META_KEY = 'studio_vault_meta', FAIL_KEY = 'studio_vault_fail', LOCK_KEY = 'studio_autolock', BIO_KEY = 'studio_bio';
  const SYS_KEYS = [META_KEY, FAIL_KEY, LOCK_KEY, BIO_KEY];
  const ITER = 250000, PREFIX = 'enc1:', CHECK = 'studio-vault-ok';
  const te = new TextEncoder(), td = new TextDecoder();
  const $ = id => document.getElementById(id);
  const norm = s => String(s||'').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const year = () => { try { return new Intl.DateTimeFormat('fa-IR', {year:'numeric'}).format(new Date()); } catch(e){ return String(new Date().getFullYear()); } };
  window.__appCredit = () => ({ year: year(), owner: OWNER });

  function b64e(buf){ const b = new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
  function b64d(str){ const s = atob(str); const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i); return b; }
  async function deriveKey(pw, salt, iter){
    const base = await crypto.subtle.importKey('raw', te.encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations: iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  }
  async function encStr(key, str){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, te.encode(str)));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
    return PREFIX + b64e(out);
  }
  async function decStr(key, s){
    const raw = b64d(s.slice(PREFIX.length));
    return td.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: raw.slice(0,12) }, key, raw.slice(12)));
  }

  const Vault = { cache:{}, key:null, pending:new Set(), busy:Promise.resolve(), unlocked:false, warned:false, locked:false };
  Vault.get = k => Object.prototype.hasOwnProperty.call(Vault.cache, k) ? Vault.cache[k] : null;
  Vault.set = (k, v) => { Vault.cache[k] = v; Vault.pending.add(k); Vault.flush(); };
  async function flushNow(){
    if(!Vault.key) return;
    const keys = [...Vault.pending]; Vault.pending.clear();
    for(const k of keys){
      try { localStorage.setItem(k, await encStr(Vault.key, Vault.cache[k])); }
      catch(e){ if(!Vault.warned){ Vault.warned = true; alert('ذخیره روی این مرورگر ناموفق بود (احتمالاً حافظه پر است). یک بک‌آپ بگیر و تصاویر یا داده‌های اضافه را کم کن.'); } }
    }
  }
  Vault.flush = () => { Vault.busy = Vault.busy.then(flushNow).catch(()=>{}); return Vault.busy; };

  const hasMeta = () => !!localStorage.getItem(META_KEY);
  const dataKeys = () => { const out = []; for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith('studio_') && !SYS_KEYS.includes(k)) out.push(k); } return out; };
  const hasPlain = () => dataKeys().some(k => !(localStorage.getItem(k)||'').startsWith(PREFIX));

  async function loadAll(key){
    for(const k of dataKeys()){
      const raw = localStorage.getItem(k) || '';
      if(raw.startsWith(PREFIX)){ try { Vault.cache[k] = await decStr(key, raw); } catch(e){ /* مورد خراب: نادیده گرفته می‌شود */ } }
      else { Vault.cache[k] = raw; Vault.pending.add(k); }
    }
  }
  async function verifyWith(pw){
    const meta = JSON.parse(localStorage.getItem(META_KEY));
    const key = await deriveKey(pw, b64d(meta.salt), meta.iter);
    try { return (await decStr(key, meta.check)) === CHECK ? key : null; } catch(e){ return null; }
  }
  Vault.setup = async pw => {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(pw, salt, ITER);
    const meta = { v:1, salt: b64e(salt), iter: ITER, check: await encStr(key, CHECK) };
    await loadAll(key);
    localStorage.setItem(META_KEY, JSON.stringify(meta));
    Vault.key = key;
    await Vault.flush();
    Vault.unlocked = true;
  };
  Vault.unlock = async pw => {
    const key = await verifyWith(pw);
    if(!key) return false;
    await loadAll(key);
    Vault.key = key;
    await Vault.flush();
    Vault.unlocked = true;
    return true;
  };
  Vault.verify = async pw => !!(await verifyWith(pw));
  Vault.unlockWithKey = async key => {
    const meta = JSON.parse(localStorage.getItem(META_KEY));
    try { if((await decStr(key, meta.check)) !== CHECK) return false; } catch(e){ return false; }
    await loadAll(key);
    Vault.key = key;
    await Vault.flush();
    Vault.unlocked = true;
    return true;
  };
  Vault.changePassword = async (oldPw, newPw) => {
    const oldKey = await verifyWith(oldPw);
    if(!oldKey) return false;
    await Vault.flush();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const newKey = await deriveKey(newPw, salt, ITER);
    const meta = { v:1, salt: b64e(salt), iter: ITER, check: await encStr(newKey, CHECK) };
    const out = {};
    for(const k of Object.keys(Vault.cache)) out[k] = await encStr(newKey, Vault.cache[k]);
    // نوشتن همه‌چیز پشت سر هم و بدون وقفه تا کلید و داده‌ها هم‌زمان عوض شوند
    for(const k of Object.keys(out)) localStorage.setItem(k, out[k]);
    localStorage.setItem(META_KEY, JSON.stringify(meta));
    Vault.key = newKey;
    return true;
  };
  Vault.getAutolock = () => { const v = localStorage.getItem(LOCK_KEY); return v === null ? 5 : (parseInt(v) || 0); };
  Vault.setAutolock = m => { localStorage.setItem(LOCK_KEY, String(m)); };
  Vault.resetAll = async () => {
    dataKeys().concat(SYS_KEYS.filter(k=>k!==LOCK_KEY)).forEach(k => localStorage.removeItem(k));
    try { await idbDelete(); } catch(e){}
    location.reload();
  };
  window.__vault = Vault;


  /* ---------- ورود با اثر انگشت / چهره (WebAuthn) ----------
     حالت امن (prf): رمز با کلیدی قفل می‌شود که فقط بعد از تأیید بایومتریک از خود گوشی بیرون می‌آید.
     حالت راحتی (gate): تأیید بایومتریک انجام می‌شود ولی کلید رمزگشایی روی همین مرورگر نگهداری می‌شود. */
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  function idbOpen(){ return new Promise((res, rej) => { const r = indexedDB.open('studioBio', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async function idbPut(k, v){ const db = await idbOpen(); return new Promise((res, rej) => { const t = db.transaction('k','readwrite'); t.objectStore('k').put(v, k); t.oncomplete = () => { db.close(); res(); }; t.onerror = () => rej(t.error); }); }
  async function idbGet(k){ const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('k').objectStore('k').get(k); q.onsuccess = () => { db.close(); res(q.result); }; q.onerror = () => rej(q.error); }); }
  function idbDelete(){ return new Promise(res => { const r = indexedDB.deleteDatabase('studioBio'); r.onsuccess = r.onerror = r.onblocked = () => res(); setTimeout(res, 1500); }); }
  async function wrapKeyFrom(prfOut){
    const base = await crypto.subtle.importKey('raw', prfOut, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info: te.encode('atelier-vault-wrap') }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  }
  async function assertion(credId, salt){
    const pk = { challenge: rnd(32), rpId: location.hostname, allowCredentials: [{ type:'public-key', id: b64d(credId), transports:['internal'] }], userVerification:'required', timeout:60000 };
    if(salt) pk.extensions = { prf: { eval: { first: salt } } };
    const a = await navigator.credentials.get({ publicKey: pk });
    if(!salt) return null;
    const r = a.getClientExtensionResults().prf;
    return (r && r.results && r.results.first) ? new Uint8Array(r.results.first) : null;
  }
  const Bio = { avail:false };
  Bio.config = () => { try { return JSON.parse(localStorage.getItem(BIO_KEY)); } catch(e){ return null; } };
  Bio.available = async () => { try { return !!(window.PublicKeyCredential && navigator.credentials && crypto.subtle && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } };
  Bio.disable = async () => { localStorage.removeItem(BIO_KEY); try { await idbDelete(); } catch(e){} };
  Bio.enroll = async pw => {
    const key = await verifyWith(pw);
    if(!key) return { ok:false, reason:'badpw' };
    const salt = rnd(32);
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name:'حساب‌داری آتلیه', id: location.hostname },
      user: { id: rnd(16), name:'atelier-user', displayName:'کاربر آتلیه' },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      attestation:'none', timeout:60000, extensions: { prf: { eval: { first: salt } } }
    }});

    const ext = cred.getClientExtensionResults().prf || {};
    let prfOut = ext.results && ext.results.first ? new Uint8Array(ext.results.first) : null;
    if(!prfOut && ext.enabled){ try { prfOut = await assertion(credId, salt); } catch(e){ prfOut = null; } }
    let cfg;
    if(prfOut){
      const wrapped = await encStr(await wrapKeyFrom(prfOut), norm(pw));
      cfg = { v:1, mode:'prf', credId, salt: b64e(salt), wrapped };
    } else {
      await idbPut('vaultKey', key);
      cfg = { v:1, mode:'gate', credId };
    }
    localStorage.setItem(BIO_KEY, JSON.stringify(cfg));
    return { ok:true, mode: cfg.mode };
  };
  // نتیجه: { pw } در حالت امن یا { key } در حالت راحتی؛ خطا یعنی تأیید انجام نشد
  Bio.auth = async () => {
    const cfg = Bio.config(); if(!cfg) throw new Error('no-bio');
    if(cfg.mode === 'prf'){
      const out = await assertion(cfg.credId, b64d(cfg.salt));
      if(!out) throw new Error('no-prf');
      return { pw: await decStr(await wrapKeyFrom(out), cfg.wrapped) };
    }
    await assertion(cfg.credId, null);
    const key = await idbGet('vaultKey');
    if(!key) throw new Error('no-key');
    return { key };
  };
  window.__bio = Bio;
  Bio.available().then(v => { Bio.avail = v; });

  /* ---------- محدودیت تلاش اشتباه ---------- */
  function failState(){ try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || { n:0, until:0 }; } catch(e){ return { n:0, until:0 }; } }
  const waitSec = () => Math.max(0, Math.ceil((failState().until - Date.now())/1000));
  function registerFail(){ const f = failState(); f.n++; if(f.n >= 5) f.until = Date.now() + Math.min(600, 30*(f.n-4))*1000; localStorage.setItem(FAIL_KEY, JSON.stringify(f)); }
  const clearFail = () => localStorage.removeItem(FAIL_KEY);

  /* ---------- صفحه قفل ---------- */
  function creditHTML(){ return `<div class="lock-credit">© ${esc(year())} — تمامی حقوق این برنامه محفوظ است<br>طراحی و توسعه: ${esc(OWNER)}</div>`; }
  function wireEyes(root){ root.querySelectorAll('.lock-eye').forEach(b => b.addEventListener('click', () => { const i = $(b.dataset.eye); i.type = i.type === 'password' ? 'text' : 'password'; })); }
  function showLock(mode, opts){
    opts = opts || {};
    const el = $('lockScreen'); el.classList.add('show');
    const logoEl = document.querySelector('link[rel="apple-touch-icon"]'); const logo = logoEl ? logoEl.href : '';
    const eye = id => `<button type="button" class="lock-eye" data-eye="${id}" aria-label="نمایش رمز">👁</button>`;
    if(mode === 'setup'){
      el.innerHTML = `<div class="lock-box"><img class="lock-logo" src="${logo}" alt="">
        <div class="lock-title">ایجاد رمز ورود</div>
        <div class="lock-sub">برای حفاظت از اطلاعات آتلیه یک رمز انتخاب کن. از این به بعد هر بار برنامه را باز کنی همین رمز را می‌زنی.<br>اطلاعات با این رمز رمزگذاری می‌شود و رمز جایی ذخیره نمی‌شود؛ <b>اگر فراموشش کنی اطلاعات قابل بازیابی نیست</b> مگر از فایل بک‌آپ.${hasPlain() ? '<br>اطلاعات فعلی این دستگاه هم با همین رمز محافظت می‌شود.' : ''}</div>
        <div class="lock-wrap"><input id="lkPw" type="password" autocomplete="new-password" placeholder="رمز ورود (حداقل ۶ کاراکتر)">${eye('lkPw')}</div>
        <div class="lock-wrap"><input id="lkPw2" type="password" autocomplete="new-password" placeholder="تکرار رمز">${eye('lkPw2')}</div>
        <div class="lock-err" id="lkErr"></div>
        <button id="lkGo" class="btn btn-red" style="width:100%">ایجاد رمز و ورود</button>${creditHTML()}</div>`;
      wireEyes(el);
      const go = async () => {
        const p = $('lkPw').value, p2 = $('lkPw2').value, err = $('lkErr');
        if(p.length < 6){ err.textContent = 'رمز باید حداقل ۶ کاراکتر باشد'; return; }
        if(p !== p2){ err.textContent = 'تکرار رمز یکسان نیست'; return; }
        if(!(window.crypto && crypto.subtle)){ err.textContent = 'این مرورگر یا آدرس از رمزگذاری پشتیبانی نمی‌کند (برنامه باید از https باز شود)'; return; }
        const b = $('lkGo'); b.disabled = true; b.textContent = 'در حال ایجاد...';
        try { await Vault.setup(p); bootApp(); } catch(e){ err.textContent = 'خطا در ایجاد رمز: ' + e.message; b.disabled = false; b.textContent = 'ایجاد رمز و ورود'; }
      };
      $('lkGo').addEventListener('click', go);
      el.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if(e.key === 'Enter') go(); }));
      setTimeout(() => $('lkPw') && $('lkPw').focus(), 50);
      return;
    }
    const relock = mode === 'relock';
    const bioCfg = Bio.config();
    el.innerHTML = `<div class="lock-box"><img class="lock-logo" src="${logo}" alt="">
      <div class="lock-title">${relock ? 'برنامه قفل است' : 'ورود به برنامه'}</div>
      <div class="lock-sub">رمز ورود را بزن تا اطلاعات باز شود.</div>
      <div class="lock-wrap"><input id="lkPw" type="password" autocomplete="current-password" placeholder="رمز ورود">${eye('lkPw')}</div>
      <div class="lock-err" id="lkErr"></div>
      <button id="lkGo" class="btn btn-red" style="width:100%">ورود</button>
      ${bioCfg ? `<button id="lkBio" class="btn btn-outline" style="width:100%;margin-top:10px">🔓 ورود با اثر انگشت یا چهره</button>` : ''}
      ${relock ? '' : `<button id="lkForgot" class="lock-link">رمز را فراموش کرده‌ام</button><div id="lkResetBox"></div>`}
      ${creditHTML()}</div>`;
    wireEyes(el);
    const err = $('lkErr');
    const tick = () => { const w = waitSec(); if(w > 0){ err.textContent = 'تلاش‌های اشتباه زیاد بود. ' + w + ' ثانیه صبر کن.'; setTimeout(tick, 1000); } else if(err.textContent.indexOf('صبر کن') > -1) err.textContent = ''; };
    tick();
    const finish = () => {
      clearFail();
      if(relock){ Vault.locked = false; lastAct = Date.now(); el.classList.remove('show'); el.innerHTML = ''; }
      else bootApp();
    };
    let bioBusy = false;
    const bioGo = async auto => {
      if(bioBusy) return; bioBusy = true;
      const b = $('lkBio'); if(b){ b.disabled = true; }
      try {
        const r = await Bio.auth();
        let ok = true;
        if(!relock) ok = r.pw ? await Vault.unlock(r.pw) : await Vault.unlockWithKey(r.key);
        if(ok){ finish(); return; }
        await Bio.disable();
        err.textContent = 'ورود با بایومتریک دیگر معتبر نیست (رمز عوض شده). با رمز وارد شو و دوباره فعالش کن.';
        if(b) b.remove();
      } catch(e){
        if(!auto) err.textContent = 'تأیید اثر انگشت/چهره انجام نشد؛ دوباره امتحان کن یا رمز را بزن.';
      }
      bioBusy = false; if($('lkBio')) $('lkBio').disabled = false;
    };
    const go = async () => {
      if(waitSec() > 0){ tick(); return; }
      const p = $('lkPw').value; if(!p){ err.textContent = 'رمز را وارد کن'; return; }
      if(!(window.crypto && crypto.subtle)){ err.textContent = 'این مرورگر یا آدرس از رمزگذاری پشتیبانی نمی‌کند (برنامه باید از https باز شود)'; return; }
      const b = $('lkGo'); b.disabled = true; b.textContent = 'در حال بررسی...';
      let ok = false;
      try { ok = relock ? await Vault.verify(p) : await Vault.unlock(p); } catch(e){ ok = false; }
      b.disabled = false; b.textContent = 'ورود';
      if(ok){
        finish();
      } else {
        registerFail(); $('lkPw').value = ''; err.textContent = 'رمز درست نیست'; tick(); $('lkPw').focus();
      }
    };
    $('lkGo').addEventListener('click', go);
    $('lkBio') && $('lkBio').addEventListener('click', () => bioGo(false));
    if(bioCfg && opts.auto) setTimeout(() => bioGo(true), 350);
    $('lkPw').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    $('lkForgot') && $('lkForgot').addEventListener('click', () => {
      $('lkResetBox').innerHTML = `<div class="lock-reset"><b>رمز قابل بازیابی نیست.</b> تنها راه، پاک کردن اطلاعات این برنامه از روی همین دستگاه و شروع دوباره است. اگر فایل بک‌آپ داری، بعد از شروع دوباره می‌توانی آن را بازیابی کنی.<br>برای تأیید کلمه‌ی <b>حذف</b> را بنویس:
        <input id="lkConfirm" style="margin:8px 0;text-align:center" placeholder="حذف">
        <button id="lkWipe" class="btn btn-outline" style="width:100%;color:#C0392B">حذف همه اطلاعات برنامه و شروع دوباره</button></div>`;
      $('lkWipe').addEventListener('click', () => { if($('lkConfirm').value.trim() === 'حذف') Vault.resetAll(); else $('lkConfirm').focus(); });
    });
    setTimeout(() => $('lkPw') && $('lkPw').focus(), 50);
  }
  Vault.lock = manual => { if(!Vault.unlocked || Vault.locked) return; Vault.locked = true; showLock('relock', { auto: !manual }); };

  /* ---------- قفل خودکار ---------- */
  let lastAct = Date.now(), hiddenAt = 0;
  ['pointerdown','keydown','touchstart','scroll'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive:true, capture:true }));
  setInterval(() => { if(!Vault.unlocked || Vault.locked) return; const m = Vault.getAutolock(); if(m > 0 && Date.now() - lastAct > m*60000) Vault.lock(); }, 15000);
  document.addEventListener('visibilitychange', () => {
    if(!Vault.unlocked) return;
    if(document.hidden){ hiddenAt = Date.now(); Vault.flush(); }
    else { const m = Vault.getAutolock(); if(m > 0 && hiddenAt && Date.now() - hiddenAt > m*60000) Vault.lock(); hiddenAt = 0; }
  });
  window.addEventListener('pagehide', () => { if(Vault.unlocked) Vault.flush(); });

  /* ---------- راه‌اندازی برنامه بعد از ورود ---------- */
  function bootApp(){
    const el = $('lockScreen'); el.classList.remove('show'); el.innerHTML = '';
    lastAct = Date.now();
    const sc = document.createElement('script');
    sc.textContent = $('appMain').textContent;
    document.body.appendChild(sc);
  }
  showLock(hasMeta() ? 'login' : 'setup', { auto:true });

  /* ---------- بدون اینترنت ---------- */
  if('serviceWorker' in navigator){
    const reg = () => navigator.serviceWorker.register('./sw.js').catch(() => {});
    if(document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
})();
</script>
</body>
</html>
