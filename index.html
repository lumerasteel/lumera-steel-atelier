<style>
  /* ==========================================================================
     Atelier — Design System
     Industrial-Luxury Minimal · Neo-Morphism (primary)
     Tokens only feed the rules below; no HTML/JS structure touched.
     ========================================================================== */
  :root{
    /* ---- Color tokens — Stone White / Graphite / Red accent (60/30/10) ---- */
    --c-bg:#F2F3F5;              /* Stone White — app base surface, 60% weight */
    --c-surface:#F2F3F5;         /* neomorphic surface, same as bg for seamless relief */
    --c-panel:#FFFFFF;           /* secondary background per priority order (Stone White, then white) */
    --c-ink:#2F3338;             /* Graphite — primary text, 30% weight */
    --c-ink-soft:#565B60;        /* lighter Graphite tint — secondary text */
    --c-steel:#6B7075;           /* mid Graphite tint — muted/secondary UI elements */
    --c-steel-light:#9CA0A4;     /* light Graphite tint — disabled/faint elements */
    --c-line:#E4E5E8;            /* hairline divider */
    --c-line-soft:#EDEEF0;
    --c-accent:#E61E32;          /* Red accent — accent only, 10% weight, never dominant */
    --c-accent-soft:#FDECEE;
    --c-success:#1A7A3A;
    --c-success-soft:#EAF7EE;
    --c-black:#000000;           /* used sparingly per brand rule */
    --c-white:#FFFFFF;

    /* ---- Typography tokens ---- */
    --font-fa:'Vazirmatn','Inter',Tahoma,Arial,sans-serif;
    --fs-h1:21px; --fs-sub:13px; --fs-body:13.5px; --fs-label:12px; --fs-caption:11px; --fs-micro:9.5px;
    --fw-regular:400; --fw-medium:500; --fw-bold:700; --fw-black:800;
    --lh-tight:1.25; --lh-normal:1.5; --lh-loose:1.7;

    /* ---- Radius scale ---- */
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;

    /* ---- Elevation (neomorphic dual-tone) ---- */
    --sh-raised:6px 6px 14px rgba(20,22,24,0.09), -6px -6px 14px rgba(255,255,255,0.85);
    --sh-raised-sm:3px 3px 8px rgba(20,22,24,0.08), -3px -3px 8px rgba(255,255,255,0.8);
    --sh-inset:inset 3px 3px 7px rgba(20,22,24,0.10), inset -3px -3px 7px rgba(255,255,255,0.75);
    --sh-flat:0 1px 3px rgba(20,22,24,0.06);
    --sh-elevated:0 10px 30px rgba(15,17,20,0.09);

    /* ---- Spacing scale ---- */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;

    /* ---- Transition system ---- */
    --ease:cubic-bezier(.4,0,.2,1);
    --t-fast:0.15s; --t-med:0.25s;

    /* ---- Z-index scale ---- */
    --z-sticky:10; --z-modal:100;

    /* legacy names kept in case referenced elsewhere in the file */
    --red:var(--c-accent);
    --gray:var(--c-steel);
  }

  *{box-sizing:border-box;}
  button:focus-visible,.tab-btn:focus-visible,.pill:focus-visible,a:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;}
  body{font-family:var(--font-fa);background:radial-gradient(ellipse 900px 500px at 15% -5%, rgba(255,255,255,0.9), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(255,255,255,0.5), transparent 55%), var(--c-bg);background-attachment:fixed;color:var(--c-ink);margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:480px;margin:0 auto;padding:var(--sp-4);}
  @keyframes studioFadeIn{from{opacity:0;transform:translateY(8px) scale(0.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  /* حذف نرم یک ردیف (اقلام فاکتور، مواد، دستمزد) — به‌جای ناپدید شدن ناگهانی، محو و جمع می‌شه */
  [data-line],[data-item],[data-labor],[data-payment],[data-row-id]{transition:opacity .18s ease,transform .18s ease,max-height .2s ease,margin .18s ease;}
  .row-removing{opacity:0!important;transform:scale(0.96)!important;max-height:0!important;margin:0!important;overflow:hidden;pointer-events:none;}
  #tabContent{animation:studioFadeIn 320ms var(--ease);}
  @media (prefers-reduced-motion:reduce){ #tabContent{animation:none;} }
  h1{font-size:var(--fs-h1);font-weight:var(--fw-bold);letter-spacing:-0.01em;margin:0 0 2px;color:var(--c-ink);}
  .sub{color:var(--c-steel);font-size:var(--fs-sub);margin:0 0 var(--sp-4);}

  /* ---- هدر رنگی (بنر گرادیانت با گوشه‌های گرد پایین) — مثل هدر اپ‌های موبایل مرجع، با رنگ خودمون ---- */
  /* هدر ساده — بدون بلوک رنگی؛ فقط لوگو با رنگ اصلی خودش + یه متن کوچیک کنارش، روی همون پس‌زمینه‌ی برنامه */
  .brand-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 2px 4px;
    margin-bottom:14px;
  }
  .brand-header img{width:30px;height:30px;object-fit:contain;flex-shrink:0;}
  .brand-header .brand-text{font-size:14px;font-weight:var(--fw-bold);color:var(--c-accent);letter-spacing:0.01em;}
  .mobile-nav-bar{position:relative;}

  /* ---- Tab bar ---- */
  .tabs{display:flex;gap:2px;border-bottom:none;margin-bottom:var(--sp-4);overflow-x:auto;background:var(--c-surface);border-radius:var(--r-md);padding:5px;scrollbar-width:none;box-shadow:var(--sh-inset);}
  .tabs::-webkit-scrollbar{display:none;}
  .nav-icon{display:inline-flex;color:var(--c-steel);transition:color .15s ease,transform .15s ease;}
  /* آیتم‌های داخل شیت پایین (زیرشاخه‌های «مالی»/«داشبورد») به‌صورت کارت‌های کوچیک توی یک گرید کنار هم میان —
     به‌جای یه لیست تک‌ستونه‌ی بلند، جای کمتری می‌گیره و همه‌چیز یه‌نگاهی دیده می‌شه */
  .sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 16px 16px;}
  .nav-leaf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px 6px;border:1px solid var(--c-line-soft);border-radius:14px;background:var(--c-surface);font-family:inherit;font-size:11.5px;font-weight:500;color:var(--c-ink);cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .nav-leaf .nav-icon svg{width:22px;height:22px;}
  .nav-leaf:hover{background:rgba(0,0,0,0.04);}
  .nav-leaf-active{background:rgba(230,30,50,0.08)!important;border-color:var(--c-accent);font-weight:700;color:var(--red);}
  .nav-leaf-active .nav-icon{color:var(--red);}
  /* ---- Bottom sheet (برای انتخاب زیرشاخه‌ی «مالی» یا «داشبورد») ---- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(20,22,24,0.35);backdrop-filter:blur(2px);z-index:200;opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .bottom-sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--c-panel);border-radius:20px 20px 0 0;z-index:201;box-shadow:0 -8px 30px rgba(0,0,0,0.18);transform:translateY(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--sp-3));max-height:70vh;overflow-y:auto;}
  .sheet-backdrop.open .bottom-sheet{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--c-line);margin:10px auto 4px;}
  .sheet-title{font-weight:var(--fw-bold);font-size:var(--fs-body);padding:6px 16px 10px;color:var(--c-ink);}
  /* ---- Bottom tab bar (ناوبری اصلی) ---- */
  .bottom-tab-bar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(255,255,255,0.94);backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);border-top:1px solid var(--c-line-soft);display:flex;align-items:flex-end;justify-content:space-around;z-index:90;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -2px 16px rgba(0,0,0,0.06);}
  .bottom-tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;font-family:inherit;color:var(--c-steel);cursor:pointer;flex:1;padding:6px 2px;font-size:10.5px;transition:color .15s ease;}
  .bottom-tab-item svg{flex-shrink:0;}
  .bottom-tab-item.active{color:var(--c-accent);font-weight:700;}
  .bottom-tab-fab-wrap{flex:1;display:flex;justify-content:center;position:relative;}
  .bottom-tab-fab{position:absolute;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--c-accent);color:var(--c-white);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(230,30,50,0.35);cursor:pointer;transition:transform var(--t-fast) var(--ease);}
  .bottom-tab-fab:active{transform:scale(0.93);}
  /* فضای خالی پایین صفحه تا محتوا زیر نوار ثابت گم نشه */
  /* این پدینگ باید روی خودِ .wrap (کانتینر بیرونی) باشه نه فقط #tabContent، چون بخش «بک‌آپ» و یادداشت پایانی
     بعد از #tabContent میان و اگه فقط اون فاصله بگیره، این دوتا هنوز زیر نوار ثابت پایین گم می‌مونن */
  .wrap{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:calc(var(--sp-4) + env(safe-area-inset-top,0px));}
  .tab-btn{display:flex;align-items:center;gap:5px;padding:9px 13px;font-size:var(--fs-label);background:none;border:none;border-radius:var(--r-sm);color:var(--c-steel);cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:var(--fw-medium);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);}
  .tab-btn.active{background:var(--c-panel);color:var(--c-ink);font-weight:var(--fw-bold);box-shadow:var(--sh-raised-sm);}
  .tab-btn:hover:not(.active){color:var(--c-ink-soft);}
  .tab-btn svg{flex-shrink:0;}

  /* ---- Form controls ---- */
  input,select{font-family:inherit;font-size:var(--fs-body);color:var(--c-ink);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:9px 10px;min-height:40px;width:100%;background:var(--c-panel);transition:box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);}
  input:focus,select:focus{outline:none;border-color:var(--c-steel-light);box-shadow:0 0 0 3px rgba(20,22,24,0.05);}
  select{appearance:none;-webkit-appearance:none;-moz-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237A7A7A' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:left 10px center;padding-left:28px;cursor:pointer;}
  .row-flex{display:flex;gap:var(--sp-2);align-items:center;margin-bottom:var(--sp-2);}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:var(--r-sm);padding:12px 16px;min-height:44px;font-size:var(--fs-body);font-weight:var(--fw-medium);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease),background var(--t-fast) var(--ease);}
  .backup-row{gap:var(--sp-3);}
  .backup-row .btn{min-height:48px;font-size:var(--fs-sub);font-weight:var(--fw-bold);}
  .btn:active{transform:translateY(1px) scale(0.98);}
  .btn-black{background:var(--c-ink);color:var(--c-white);box-shadow:var(--sh-flat);}
  .btn-black:hover{opacity:0.92;}
  .btn-outline{background:rgba(255,255,255,0.78);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);color:var(--c-ink);border:1px solid var(--c-line);}
  .btn-outline:hover{border-color:var(--c-accent);color:var(--c-accent);}
  .btn-red{background:var(--c-accent);color:var(--c-white);box-shadow:0 4px 12px rgba(230,30,50,0.22);}
  .btn-red:hover{opacity:0.94;}
  .btn-icon{background:none;border:none;color:var(--c-accent);cursor:pointer;padding:4px 8px;font-size:15px;transition:transform var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease);}
  .btn-icon:active{transform:scale(0.9);}
  @media (hover:hover){
    .btn-black:hover,.btn-red:hover{transform:translateY(-1px) scale(1.015);box-shadow:0 6px 16px rgba(20,22,24,0.15);}
    .btn-outline:hover{transform:translateY(-1px) scale(1.015);box-shadow:0 4px 14px rgba(230,30,50,0.16);}
  }

  /* ---- Cards ---- */
  .card{background:rgba(255,255,255,0.85);backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);border:1px solid rgba(255,255,255,0.7);outline:1px solid var(--c-line-soft);outline-offset:-1px;border-radius:18px;padding:var(--sp-3);margin-bottom:var(--sp-2);box-shadow:var(--sh-flat);transition:box-shadow var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);}
  .card-active{border-color:var(--c-accent);}
  .card-title{font-weight:var(--fw-bold);font-size:var(--fs-body);color:var(--c-ink);display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .card-sub{font-size:var(--fs-label);color:var(--c-steel);}
  .box-gray{background:rgba(241,242,244,0.9);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:16px;padding:var(--sp-3);margin-bottom:var(--sp-4);box-shadow:var(--sh-inset);}
  @media (hover:hover){
    .card:hover{box-shadow:var(--sh-raised-sm);transform:translateY(-1px);}
  }
  @media (prefers-reduced-motion:reduce){
    .card,.btn,.btn-icon,.bottom-sheet,.sheet-backdrop,.nav-icon,.bottom-tab-fab{transition:none!important;transform:none!important;}
  }

  /* ---------- چیدمان یکسان روی همه‌ی سایزها ---------- */
  /* قبلاً از این‌جا یه چیدمان جدا برای صفحه‌ی بزرگ (نوار کناری ثابت) بود که تشخیصش وابسته به hover/pointer
     بود — همون چیزی که با آپدیت iOS اشتباه تشخیص داده شد و باعث شد نوار کناری روی گوشی هم باز بمونه.
     برای این‌که این کلاس باگ کلاً از ریشه حذف بشه، الان چیدمان روی هر سایزی (گوشی، تبلت، کامپیوتر) یکیه:
     همون ستون تکی با نوار ناوبری پایین صفحه، مثل اپ‌های موبایل. */
  /* ---------- TABLET (600px–959px: فاصله‌گذاری راحت‌تر، بدون تغییر چیدمان تک‌ستونه موبایل) ---------- */
  @media (min-width:600px) and (max-width:959px){
    .wrap{padding:var(--sp-5);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-top:calc(var(--sp-5) + env(safe-area-inset-top,0px));}
  }
  /* ---------- کامپیوتر (≥960px): همون چیدمان تک‌ستونه، ولی عریض‌تر تا وسط یه مانیتور بزرگ باریک و بی‌تناسب
     دیده نشه. هیچ شرط hover/pointer نداره — فقط عرض صفحه، که قابل‌اعتماده و منبع باگ قبلی نمی‌شه ---------- */
  @media (min-width:960px){
    .wrap, .bottom-sheet, .bottom-tab-bar{max-width:640px;}
  }
  @media (min-width:1280px){
    .wrap, .bottom-sheet, .bottom-tab-bar{max-width:760px;}
  }

  /* ---- Results panel ---- */
  .results{background:linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0) 40%), var(--c-ink);color:var(--c-white);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--sh-elevated);}
  .r-row{display:flex;justify-content:space-between;font-size:var(--fs-body);padding:4px 0;}
  .r-row span:last-child{font-family:'Inter',var(--font-fa);font-variant-numeric:tabular-nums;letter-spacing:0.01em;}
  .r-row.bold{font-weight:var(--fw-bold);}
  .r-row.accent{color:var(--c-accent);}
  hr.sep{border:none;border-top:1px solid rgba(255,255,255,0.14);margin:var(--sp-2) 0;}
  .empty{color:var(--c-steel-light);font-size:var(--fs-body);text-align:center;padding:var(--sp-6) 0;}

  /* ---- Pills / toggles ---- */
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-2);}
  .pill{border:1px solid var(--c-line);border-radius:var(--r-pill);padding:5px 11px;font-size:var(--fs-label);background:rgba(255,255,255,0.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:var(--c-steel);cursor:pointer;font-family:inherit;transition:all var(--t-fast) var(--ease);}
  .pill-active{background:var(--c-ink);color:var(--c-white);border-color:var(--c-ink);}
  .pill:active{transform:scale(0.96);}
  .mode-toggle{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-2);}
  .mode-toggle button{flex:1;}
  label.small{font-size:var(--fs-label);color:var(--c-steel);white-space:nowrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:var(--fs-label);color:var(--c-ink-soft);margin-top:var(--sp-2);}
  /* KPI/dashboard widget emphasis: a .card whose only metric is a bold accent row reads as a stat tile */
  .grid2 > .card{padding:var(--sp-4);}
  .grid2 > .card .card-title{font-size:var(--fs-label);color:var(--c-steel);font-weight:var(--fw-medium);}
  .grid2 > .card .r-row.bold.accent{font-size:22px;font-weight:var(--fw-black);color:var(--c-accent);padding-top:2px;}
  /* عدد آماری کوچیک روی کارت‌های داشبورد (مثلا تعداد پروژه‌های فعال) — نباید با عدد قیمت اصلی توی ماشین‌حساب
     (بالا، همون سایز و وزن) قاطی بشه؛ یه‌خرده کوچیک‌تر و سبک‌تره چون فقط یه شمارشگره، نه مبلغ قیمت‌گذاری */
  .dash-stat-num{font-size:20px;font-weight:var(--fw-black);color:var(--c-accent);}
  @media (max-width:380px){
    .grid2{grid-template-columns:1fr;gap:8px;}
  }
  h2.sec{font-size:var(--fs-label);font-weight:var(--fw-bold);margin-bottom:var(--sp-2);letter-spacing:0.01em;text-transform:none;}
  .note{font-size:var(--fs-caption);color:var(--c-steel);margin-top:var(--sp-6);text-align:center;}

  /* ---- INVOICE TAB ---- */
  .inv-status{display:inline-block;font-size:var(--fs-caption);font-weight:var(--fw-bold);border-radius:var(--r-pill);padding:3px 10px;cursor:pointer;user-select:none;border:1px solid var(--c-line);}
  .inv-status.draft{background:var(--c-surface);color:var(--c-steel);border-color:var(--c-line);}
  .inv-status.final{background:var(--c-accent-soft);color:var(--c-accent);border-color:var(--c-accent);}
  .inv-status.paid{background:var(--c-success-soft);color:var(--c-success);border-color:var(--c-success);}
  .inv-status.cancelled{background:var(--c-surface);color:var(--c-steel-light);border-color:var(--c-line);text-decoration:line-through;}
  .inv-line{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .inv-line select{flex:1.4;}
  .inv-line input.qty{width:54px;}
  .inv-line .lt{flex:1;font-size:var(--fs-label);}
  .badge-activity{display:inline-block;font-size:var(--fs-caption);border-radius:6px;padding:2px 8px;background:var(--c-ink);color:var(--c-white);margin-left:4px;}

  /* ---- A4 print invoice (flat, print-safe — no neomorphism) ---- */
  #invoiceRenderRoot{position:fixed;left:-9999px;top:0;}
  .a4-wrap{--a4-accent:#E61E32;--a4-ink:#2F3338;--a4-muted:#6B7075;--a4-soft:#F7F7F7;--a4-head-bg:#2F3338;width:794px;background:#fff;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;direction:rtl;}
  .a4-page{padding:40px 52px 32px 52px;display:flex;flex-direction:column;}
  .a4-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .a4-header-right{display:flex;flex-direction:column;gap:3px;}
  .a4-header-name{font-size:13px;font-weight:700;color:var(--a4-ink);white-space:nowrap;}
  .a4-line-contents{font-size:9px;color:var(--a4-muted);margin-top:2px;line-height:1.6;font-weight:400;}
  .a4-header-meta{font-size:10.5px;color:var(--a4-muted);white-space:nowrap;}
  .a4-logo{height:60px;width:auto;object-fit:contain;}
  .a4-title-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .a4-red-line{flex:1;height:2px;background:var(--a4-accent);}
  .a4-invoice-title{font-size:20px;font-weight:800;color:var(--a4-ink);white-space:nowrap;}
  .a4-grid{display:grid;gap:1px;background:#E0E0E0;border-radius:10px;overflow:hidden;margin-bottom:8px;}
  .a4-meta-grid{grid-template-columns:1.3fr 1.3fr 1fr 1fr 1fr;}
  .a4-customer-grid{grid-template-columns:2fr 1.2fr 1fr;margin-bottom:14px;}
  .a4-cell{background:var(--a4-soft);padding:9px 13px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
  .a4-cell-label{font-size:9.5px;color:var(--a4-muted);font-weight:500;white-space:nowrap;}
  .a4-cell-value{font-size:11.5px;color:var(--a4-ink);font-weight:600;white-space:nowrap;overflow:hidden;}
  .a4-note{font-size:9.5px;color:var(--a4-muted);margin-bottom:4px;}
  .a4-table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:4px;}
  .a4-table thead tr{background:var(--a4-head-bg);}
  .a4-table thead th{padding:9px 10px;font-size:10.5px;font-weight:600;color:#fff;text-align:center;white-space:nowrap;}
  .a4-table thead th:first-child{border-radius:0 8px 0 0;}
  .a4-table thead th:last-child{border-radius:8px 0 0 0;}
  .a4-col-num{width:30px;}.a4-col-desc{width:33%;}.a4-col-mat{width:17%;}.a4-col-qty{width:8%;}.a4-col-unit{width:14%;}.a4-col-total{width:14%;}
  .a4-table tbody tr{background:#fff;}
  .a4-table tbody tr:nth-child(even){background:#FAFAFA;}
  .a4-table tbody td{padding:6px 8px;font-size:11px;text-align:center;height:34px;border-bottom:1px solid #F0F0F0;border-left:1px solid #F0F0F0;}
  .a4-table tbody td:last-child{border-left:none;}
  .a4-table tbody td.a4-col-desc{text-align:right;padding-right:10px;}
  .a4-row-num{font-size:9.5px;color:#C0C0C0;}
  .a4-bottom-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px;flex:1;}
  .a4-terms-box{background:var(--a4-soft);border-radius:12px;padding:12px 14px;}
  .a4-terms-columns{display:flex;gap:16px;}
  .a4-terms-col{flex:1;min-width:0;}
  .a4-terms-col:not(:last-child){border-left:1px solid #E3E3E3;padding-left:16px;margin-left:-16px;}
  .a4-finance-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .a4-terms-title{font-size:10.5px;font-weight:700;color:var(--a4-ink);margin-bottom:8px;padding-bottom:5px;border-bottom:1.5px solid var(--a4-accent);display:inline-block;}
  .a4-terms-subtitle{font-size:9.5px;font-weight:700;color:var(--a4-muted);margin:8px 0 4px;}
  .a4-terms-subtitle:first-of-type{margin-top:0;}
  .a4-group-row td{background:#F0F0F0;font-size:9.5px;font-weight:700;color:var(--a4-ink);padding:4px 8px;text-align:right;}
  .a4-terms-list{list-style:none;display:flex;flex-direction:column;gap:5px;padding:0;margin:0;}
  .a4-terms-list li{font-size:9.5px;color:var(--a4-muted);line-height:1.65;padding-right:10px;position:relative;}
  .a4-terms-list li::before{content:'';position:absolute;right:0;top:6px;width:3.5px;height:3.5px;background:#C0C0C0;border-radius:50%;}
  .a4-terms-list li.important{color:var(--a4-ink);font-weight:600;}
  .a4-terms-list li.important::before{background:var(--a4-accent);}
  .a4-summary-box{display:flex;flex-direction:column;gap:8px;}
  .a4-summary-card{background:var(--a4-soft);border-radius:12px;padding:10px 13px;}
  .a4-summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #ECECEC;}
  .a4-summary-row:last-child{border-bottom:none;}
  .a4-sr-label{font-size:10.5px;color:var(--a4-muted);font-weight:500;}
  .a4-sr-value{font-size:10.5px;color:var(--a4-ink);font-weight:600;}
  .a4-summary-row.total .a4-sr-label{font-size:11px;font-weight:700;color:var(--a4-ink);}
  .a4-summary-row.total .a4-sr-value{font-size:13px;font-weight:800;color:var(--a4-accent);}
  .a4-summary-row.balance .a4-sr-value{color:var(--a4-accent);font-weight:700;}
  .a4-amount-words{font-size:9.5px;color:var(--a4-muted);text-align:right;margin-top:6px;padding-top:6px;border-top:1px dashed #DDD;line-height:1.5;}
  .a4-prev-note{font-size:9px;color:var(--a4-muted);margin-top:6px;padding-top:6px;border-top:1px dashed #DDD;line-height:1.5;}
  .a4-payment-card{background:var(--a4-soft);border-radius:12px;padding:10px 13px;}
  .a4-payment-title{font-size:9.5px;font-weight:700;color:var(--a4-muted);margin-bottom:7px;}
  .a4-footer{margin-top:14px;padding-top:10px;border-top:1px solid #E0E0E0;display:flex;justify-content:space-between;align-items:center;}
  .a4-footer-slogan{font-size:10px;font-weight:700;color:var(--a4-ink);white-space:nowrap;}
  .a4-footer-social{font-size:10.5px;font-weight:600;color:var(--a4-muted);white-space:nowrap;}

  /* ---- قالب‌های فاکتور: مدرن (سربرگ رنگی) و مینیمال ---- */
  .a4-style-accent .a4-table thead tr{background:var(--a4-accent);}
  .a4-style-accent .a4-red-line{height:3px;}
  .a4-style-accent .a4-invoice-title{color:var(--a4-accent);}
  .a4-style-accent .a4-header{border-bottom:3px solid var(--a4-accent);padding-bottom:12px;}
  .a4-style-minimal .a4-table thead tr{background:#fff;}
  .a4-style-minimal .a4-table thead th{color:var(--a4-ink);border-bottom:2px solid var(--a4-accent);}
  .a4-style-minimal .a4-cell,.a4-style-minimal .a4-terms-box,.a4-style-minimal .a4-summary-card,.a4-style-minimal .a4-payment-card{background:#fff;}
  .a4-style-minimal .a4-terms-box,.a4-style-minimal .a4-summary-card,.a4-style-minimal .a4-payment-card{border:1px solid #E0E0E0;}
  .a4-style-minimal .a4-group-row td{background:#fff;border-bottom:1px solid #E0E0E0;}


  /* ---- صفحه‌بندی A4 (هر برگه دقیقاً یک صفحه) ---- */
  .a4-sheets{width:794px;}
  .a4-sheet{--a4-accent:#E61E32;--a4-ink:#2F3338;--a4-muted:#6B7075;--a4-soft:#F7F7F7;--a4-head-bg:#2F3338;width:794px;height:1123px;box-sizing:border-box;background:#fff;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;direction:rtl;overflow:hidden;position:relative;}
  .a4-sheet .a4-page{height:100%;box-sizing:border-box;}
  .a4-sheet .a4-footer{margin-top:auto;flex:none;}
  .a4-sheet .a4-bottom-grid{flex:none;}
  .a4-cont-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--a4-accent);padding-bottom:8px;margin-bottom:14px;font-size:11px;color:var(--a4-ink);font-weight:700;}
  .a4-cont-header span:last-child{color:var(--a4-muted);font-weight:500;}
  .a4-page-no{font-size:9.5px;color:var(--a4-muted);font-weight:600;}
  .a4-compact .a4-page{padding-top:26px;padding-bottom:20px;}
  .a4-compact .a4-header{margin-bottom:10px;}
  .a4-compact .a4-title-bar{margin-bottom:10px;}
  .a4-compact .a4-table tbody td{height:26px;padding:3px 8px;}
  .a4-compact .a4-terms-box{padding:8px 12px;}
  .a4-compact .a4-terms-list{gap:3px;}
  .a4-compact .a4-bottom-grid{gap:8px;margin-top:8px;}
  .a4-compact .a4-footer{margin-top:8px;}


  /* ---- قرارداد ---- */
  .a4-party-grid{grid-template-columns:1fr 1fr;margin-bottom:12px;}
  .a4-contract-meta{grid-template-columns:1fr 1fr 1fr 1fr 1.6fr;}
  .a4-preamble{font-size:11px;color:var(--a4-ink);line-height:2;margin:2px 0 12px;text-align:justify;}
  .a4-clause{padding:0;}
  .a4-clause-title{font-size:11.5px;font-weight:800;color:var(--a4-ink);margin:0 0 3px;}
  .a4-clause-p{font-size:10.5px;color:var(--a4-ink);line-height:2;text-align:justify;margin:0;}
  .a4-sign-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:6px;}
  .a4-sign-box{border:1px solid #D8D8D8;border-radius:10px;padding:10px 12px;min-height:100px;font-size:10.5px;color:var(--a4-ink);display:flex;flex-direction:column;gap:5px;}
  .a4-sign-line{margin-top:auto;font-size:9.5px;color:var(--a4-muted);border-top:1px dashed #BBB;padding-top:4px;text-align:center;}


  /* ---- ثبت هزینه سریع ---- */
  #qeOverlay,#fabOverlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:8500;background:rgba(20,22,25,.55);display:flex;align-items:flex-end;justify-content:center;}
  .qe-sheet{width:100%;max-width:520px;max-height:96%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--c-bg);border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);}
  .qe-seg{display:flex;gap:6px;margin-bottom:10px;}
  .qe-seg button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid transparent;background:var(--c-panel);font-family:inherit;font-size:13px;font-weight:700;color:var(--c-ink);cursor:pointer;}
  .qe-seg button.on{border-color:var(--c-accent);background:var(--c-accent-soft);color:var(--c-accent);}
  .qe-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;max-height:84px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .qe-chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--c-line);background:var(--c-panel);font-family:inherit;font-size:12.5px;color:var(--c-ink);cursor:pointer;}
  .qe-chip.on{border-color:var(--c-accent);background:var(--c-accent);color:#fff;font-weight:700;}
  .qe-flex{padding:0;display:flex;flex-direction:column;overflow:hidden;}
  .qe-body{overflow:auto;flex:1 1 auto;padding:14px 14px 4px;-webkit-overflow-scrolling:touch;}
  .qe-foot{flex:none;padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--c-line);background:var(--c-bg);}
  .qe-amt{text-align:center;font-size:30px;font-weight:800;color:var(--c-ink);padding:6px 0 0;min-height:44px;letter-spacing:.02em;}
  .qe-words{text-align:center;font-size:11.5px;color:var(--c-steel);min-height:18px;margin-bottom:8px;}
  .qe-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;direction:ltr;}
  .qe-key{height:46px;border-radius:14px;border:none;background:var(--c-panel);font-family:inherit;font-size:21px;font-weight:700;color:var(--c-ink);cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.08);}
  .qe-key:active{transform:scale(.96);background:var(--c-accent-soft);}
  .qe-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:8600;background:#2F3338;color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92%;}
  .qe-toast button{background:none;border:none;color:#FFB3BB;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;padding:2px 4px;}

  /* ---- صفحه قفل ---- */
  #lockScreen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;display:none;align-items:center;justify-content:center;background:var(--c-bg);padding:20px;overflow:auto;}
  #lockScreen.show{display:flex;}
  .lock-box{width:100%;max-width:360px;text-align:center;margin:auto;}
  .lock-logo{width:76px;height:76px;border-radius:20px;margin:0 auto 14px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.12);}
  .lock-title{font-size:19px;font-weight:800;color:var(--c-ink);margin-bottom:6px;}
  .lock-sub{font-size:12px;color:var(--c-steel);margin-bottom:16px;line-height:1.9;}
  .lock-wrap{position:relative;margin-bottom:10px;}
  .lock-wrap input{width:100%;text-align:center;padding-left:44px;padding-right:44px;}
  .lock-eye{position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;padding:6px;}
  .lock-err{color:#C0392B;font-size:12px;min-height:20px;margin-bottom:8px;font-weight:700;}
  .lock-credit{margin-top:26px;font-size:11px;color:var(--c-steel);line-height:2;}
  .lock-link{background:none;border:none;color:var(--c-steel);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:12px;font-family:inherit;}
  .lock-reset{margin-top:12px;padding:12px;border:1px solid #E0B4AE;border-radius:12px;background:#FFF6F5;text-align:right;font-size:12px;line-height:1.9;color:#7A2E26;}
</style>
</head>

/* تبدیل میلادی به شمسی (الگوریتم استاندارد بدون کتابخانه خارجی) */
function toJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + (Math.floor((gy2+3)/4)) - (Math.floor((gy2+99)/100)) + (Math.floor((gy2+399)/400)) - 80 + gd + g_d_m[gm-1];
  jy += 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1)%365; }
  let jm, jd;
  if(days < 186){ jm = 1 + Math.floor(days/31); jd = 1 + (days%31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186)%30); }
  return [jy, jm, jd];
}
/* تبدیل شمسی به میلادی (معکوس toJalali — الگوریتم استاندارد jalaali) */
function toGregorian(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100*Math.floor(--days/36524);
    days %= 36524;
    if(days >= 365) days++;
  }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1)%365;
  }
  let gd = days+1;
  const sal_a = [0,31,((gy%4===0 && gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for(gm=0; gm<13 && gd>sal_a[gm]; gm++) gd -= sal_a[gm];
  return [gy, gm, gd];
}
/* تبدیل رشته تاریخ شمسی به فرم ورودی کاربر (مثل ۱۴۰۳/۰۴/۰۵ یا 1403-04-05) به رشته میلادی ISO YYYY-MM-DD */
function jalaliInputToISO(str){
  if(!str) return '';
  const normalized = normalizeDigits(String(str).trim()).replace(/[\/\.]/g,'-');
  const parts = normalized.split('-').map(p=>parseInt(p,10));
  if(parts.length!==3 || parts.some(isNaN)) return '';
  let [jy,jm,jd] = parts;
  if(jy<100) jy += 1400; // ورودی کوتاه مثل 03-04-05 را به 1403 تعبیر می‌کنیم (بعید است، ولی محافظه‌کارانه)
  if(jm<1||jm>12||jd<1||jd>31) return '';
  const [gy,gm,gd] = toGregorian(jy,jm,jd);
  const p2 = n=>String(n).padStart(2,'0');
  return `${gy}-${p2(gm)}-${p2(gd)}`;
}
// کامپوننت ورودی تاریخ شمسی: یک input متنی که مقدار شمسی نشان می‌دهد، اما مقدار ذخیره‌شده همیشه میلادی ISO است
// placeholder نمونه‌ی فرمت را نشان می‌دهد؛ خطای ورودی نامعتبر را به‌صورت رنگ قرمز بوردر نشان می‌دهیم
function renderJalaliDateInput(id, isoValue, extraStyle){
  const display = isoValue ? jalaliStr(isoValue) : '';
  return `<input id="${id}" inputmode="numeric" placeholder="۱۴۰۳/۰۴/۰۵" value="${escapeAttr(display)}" data-iso="${escapeAttr(isoValue||'')}" style="${extraStyle||''}">`;
}
// روی یک input ساخته‌شده با renderJalaliDateInput رویداد می‌بندد؛ با هر تغییر، مقدار را به ISO تبدیل کرده و callback را صدا می‌زند
function bindJalaliDateInput(id, onChangeISO){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('blur', e=>{
    const iso = jalaliInputToISO(e.target.value);
    if(!e.target.value.trim()){ el.style.borderColor=''; onChangeISO(''); return; }
    if(!iso){
      el.style.borderColor = 'var(--red)';
      return; // مقدار نامعتبر را ذخیره نمی‌کنیم، کاربر باید اصلاح کند
    }
    el.style.borderColor = '';
    e.target.value = jalaliStr(iso);
    onChangeISO(iso);
  });
}
function toPersianDigits(str){
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(str).replace(/[0-9]/g, d=>fa[+d]);
}
function toLatinDigits(str){
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  return String(str).replace(/[۰-۹]/g, d=>String(fa.indexOf(d)));
}
function jalaliStr(dateStr){
  if(!dateStr) return '';
  const [gy,gm,gd] = dateStr.split('-').map(Number);
  if(!gy||!gm||!gd) return dateStr;
  const [jy,jm,jd] = toJalali(gy,gm,gd);
  const p2 = n=>String(n).padStart(2,'0');
  return toPersianDigits(`${jy}/${p2(jm)}/${p2(jd)}`);
}
// اول ماه شمسی جاری را به تاریخ میلادی ISO برمی‌گرداند — چون «این ماه» برای کاربر یعنی ماه شمسی، نه میلادی
function jalaliMonthStartISO(){
  const now = new Date();
  const [jy, jm] = toJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  const [gy, gm, gd] = toGregorian(jy, jm, 1);
  const p2 = n=>String(n).padStart(2,'0');
  return `${gy}-${p2(gm)}-${p2(gd)}`;
}
function invNumStr(n){
  return toPersianDigits(String(n).padStart(3,'0'));
}
function projectCodeDisplay(code){
  const c = (code||'').trim();
  if(!c) return '-';
  return c.toUpperCase().startsWith('ST-') ? c : ('ST-' + c);
}
function addMonths(dateStr, months){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function fmt(n){ if(!isFinite(n)) return '۰'; return Math.round(n).toLocaleString('fa-IR'); }
// تبدیل ارقام فارسی (۰-۹) و عربی (٠-٩) به ارقام لاتین، تا ورودی‌های prompt/input هم با اعداد فارسی درست پارس شوند
function normalizeDigits(str){
  if(str==null) return str;
  const persian = '۰۱۲۳۴۵۶۷۸۹', arabic = '٠١٢٣٤٥٦٧٨٩';
  return String(str).replace(/[۰-۹٠-٩]/g, ch=>{
    let idx = persian.indexOf(ch);
    if(idx===-1) idx = arabic.indexOf(ch);
    return idx===-1 ? ch : String(idx);
  }).replace(/[٫،]/g,'.'); // جداکننده اعشاری فارسی/عربی هم به نقطه تبدیل شود
}
// نسخه سراسری parseFloat را با نسخه‌ای جایگزین می‌کنیم که قبل از پارس، ارقام فارسی/عربی را به لاتین تبدیل می‌کند.
// برای ورودی‌های لاتین رفتار کاملاً یکسان با parseFloat اصلی دارد — فقط ورودی فارسی/عربی هم پشتیبانی می‌شود.
const _nativeParseFloat = parseFloat;
parseFloat = function(str){
  if(typeof str === 'string') return _nativeParseFloat(normalizeDigits(str));
  return _nativeParseFloat(str);
};
function parseNum(str){ return parseFloat(normalizeDigits(str)); }
// خواندن مقدار عددی که نباید منفی باشد (مثل تعداد/qty) — مقادیر منفی یا نامعتبر به صفر تبدیل می‌شوند
// این از قیمت تمام‌شده یا جمع فاکتور منفی شدن به‌خاطر تعداد منفی جلوگیری می‌کند
function parseQty(val){ const n = parseFloat(val); return (isNaN(n) || n<0) ? 0 : n; }
function numberToPersianWords(num){
  num = Math.round(Math.abs(num||0));
  if(num===0) return 'صفر';
  const ones = ['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه'];
  const tens = ['','ده','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
  const teens = ['ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
  const hundreds = ['','یکصد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
  const scales = ['','هزار','میلیون','میلیارد','تریلیون'];
  function threeDigits(n){
    n = parseInt(n,10);
    if(n===0) return '';
    const h = Math.floor(n/100), t = Math.floor((n%100)/10), o = n%10;
    const parts = [];
    if(h) parts.push(hundreds[h]);
    if(t===1) parts.push(teens[o]);
    else {
      if(t) parts.push(tens[t]);
      if(o) parts.push(ones[o]);
    }
    return parts.join(' و ');
  }
  const groups = [];
  let n = num;
  while(n>0){ groups.unshift(n%1000); n = Math.floor(n/1000); }
  const parts = [];
  for(let i=0;i<groups.length;i++){
    const g = groups[i];
    if(g===0) continue;
    const scaleIdx = groups.length-1-i;
    const words = threeDigits(g);
    parts.push(scaleIdx>0 ? words+' '+scales[scaleIdx] : words);
  }
  return parts.join(' و ');
}
function amountToWordsToman(n){
  const words = numberToPersianWords(n);
  return words + ' تومان';
}
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// عکس آپلودشده را قبل از ذخیره کوچک و فشرده می‌کند تا حجم زیاد حافظه مرورگر را پر نکند
function resizeImageFile(file, maxDim, callback){
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w>=h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = ()=> alert('این فایل به‌عنوان تصویر خوانده نشد');
    img.src = ev.target.result;
  };
  reader.onerror = ()=> alert('خواندن فایل ناموفق بود');
  reader.readAsDataURL(file);
}

// هزینه هر ردیف دستمزد را برمی‌گرداند — یا عدد دستی‌ست، محاسبه می‌شود
function laborItemCost(l){
  return parseFloat(l.cost)||0;
}
function computeTotals(){
  const materialsBreakdown = calc.items.map(it=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    const price = mat? mat.price : 0;
    return { name: mat?mat.name:'-', qty, unit: mat?mat.unit:'', price, subtotal: price*qty };
  });
  const materialsCost = materialsBreakdown.reduce((s,m)=>s+m.subtotal,0);
  const laborBreakdown = calc.laborItems.map(l=>{
    const subtotal = laborItemCost(l);
    return { name: l.name || 'دستمزد', subtotal, detail: '', calcType: 'manual' };
  });
  const laborCost = laborBreakdown.reduce((s,l)=>s+l.subtotal,0);
  const autoOverhead = computeAutoOverhead();
  const overheadCost = calc.useAutoOverhead ? autoOverhead.perUnit : 0;
  const equipBreakdown = (calc.equipItems||[]).map(it=>{ const e = equipment.find(x=>x.id===it.equipmentId); return { name: e?e.name:'-', qty: parseQty(it.qty), subtotal: depCost(it.equipmentId, it.qty) }; });
  const equipCost = equipBreakdown.reduce((a,x)=>a+x.subtotal,0);
  const totalCost = materialsCost + laborCost + equipCost + overheadCost;
  let consumerPrice = 0;
  if(calc.pricingMode==='margin'){
    const pct = parseFloat(calc.marginPct)||0;
    consumerPrice = totalCost*(1+pct/100);
  } else {
    consumerPrice = parseFloat(calc.manualPrice)||0;
  }
  const profit = consumerPrice - totalCost;
  const profitPct = totalCost>0 ? (profit/totalCost*100) : 0;
  return {materialsCost, laborCost, equipCost, equipBreakdown, overheadCost, totalCost, consumerPrice, profit, profitPct, autoOverheadInfo: autoOverhead, materialsBreakdown, laborBreakdown};
}

function finalizeRecord(){
  const name = document.getElementById('productNameInput').value.trim();
  if(!name || (calc.items.length===0 && calc.laborItems.length===0 && (calc.equipItems||[]).length===0)){ alert('نام محصول و حداقل یک ماده یا دستمزد لازم است'); return; }
  const t = computeTotals();
  const recDate = calc.recordDate || todayStr();
  // اگر همین محصول قبلاً در همین تاریخ ثبت شده باشد (مثلا اصلاح یک اشتباه)، جایگزین می‌شود
  // نه اینکه رکورد تازه‌ای روی آن اضافه شود — این باعث انباشته‌شدن بی‌مورد تاریخچه می‌شد
  const existingIdx = records.findIndex(r=> r.name===name && r.date===recDate);
  const rec = { id: existingIdx>=0 ? records[existingIdx].id : Date.now().toString(), date: recDate, name, ...t };
  if(existingIdx>=0) records[existingIdx] = rec; else records = [rec, ...records];
  saveJSON(STORE_KEYS.records, records);
  // فرمول محصول (مواد و دستمزد) هم همین‌جا در کاتالوگ ذخیره/به‌روزرسانی می‌شود تا دفعه بعد قابل ویرایش باشد
  saveCurrentAsProduct(name, false);
  clearCalc();
  tab='history';
  render();
}
function saveCurrentAsProduct(nameOverride, showAlert){
  const name = nameOverride!==undefined ? nameOverride : document.getElementById('productNameInput').value.trim();
  if(!name || (calc.items.length===0 && calc.laborItems.length===0 && (calc.equipItems||[]).length===0)){ if(showAlert!==false) alert('نام محصول و حداقل یک ماده یا دستمزد لازم است'); return; }
  const idx = products.findIndex(p=>p.name===name);
  const existing = idx>=0 ? products[idx] : null;
  const data = {
    id: existing ? existing.id : Date.now().toString(),
    name,
    categoryId: existing ? existing.categoryId : '',
    dimensions: existing ? existing.dimensions : '',
    contents: existing ? (existing.contents||[]) : [],
    image: existing ? existing.image : '',
    items: calc.items,
    laborItems: calc.laborItems,
    equipItems: (calc.equipItems||[]).map(x=>({...x}))
  };
  if(idx>=0) products[idx]=data; else products.push(data);
  saveJSON(STORE_KEYS.products, products);
  if(showAlert!==false) alert('قالب ذخیره شد');
}

function productSalePrice(productName){
  const rec = records.find(r=>r.name===productName);
  return rec ? rec.consumerPrice : 0;
}
function productSalePriceOf(productId){
  const p = products.find(x=>x.id===productId);
  return p ? productSalePrice(p.name) : 0;
}
function invLineBasePrice(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? productSalePrice(p.name) : 0;
  }
  return parseFloat(line.customPrice)||0;
}
function invLineUnitPrice(line){
  // سازگاری با نسخه‌ی قبلی: اگر «فی توافقی» قدیمی (overridePrice) روی این ردیف ثبت شده، همون رو در نظر می‌گیریم
  if(line.overridePrice!==undefined && line.overridePrice!==null && String(line.overridePrice).trim()!==''){
    return Math.max(0, parseFloat(line.overridePrice)||0);
  }
  const base = invLineBasePrice(line);
  const disc = parseFloat(line.lineDiscount)||0;
  return Math.max(0, base - disc);
}
// قیمت تمام‌شده‌ی هر واحد یک محصول ذخیره‌شده، بر اساس قیمت روز مواد و دستمزدهای ثبت‌شده در فرمول آن (بدون سربار)
function computeProductCost(product){
  if(!product) return 0;
  const materialsCost = (product.items||[]).reduce((s,it)=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    return s + (mat? mat.price*qty : 0);
  },0);
  const laborCost = (product.laborItems||[]).reduce((s,l)=>s+laborItemCost(l),0);
  return materialsCost + laborCost;
}
// قیمت تمام‌شده‌ی هر واحد یک ردیف فاکتور: برای ردیف‌های متصل به محصول، خودکار از فرمول محصول محاسبه می‌شود؛
// برای ردیف‌های دلخواه/دستی، فقط اگر کاربر «قیمت تمام‌شده» را وارد کرده باشد مشخص است، وگرنه صفر در نظر گرفته می‌شود
// (یعنی کل مبلغ آن ردیف به‌عنوان سود حساب می‌شود — برای محاسبه‌ی دقیق سود، پر کردن این فیلد توصیه می‌شود)
function invLineUnitCost(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? computeProductCost(p) : 0;
  }
  return parseFloat(line.customCost)||0;
}
function invLineName(line){
  if(line.productId){
    const p = products.find(x=>x.id===line.productId);
    return p ? p.name : '';
  }
  return line.customName||'';
}
// چند تا ردیف از یک فضای کاری خاص توی این فاکتور هست — برای نشون دادن عدد کنار تب‌های فضای کاری
function invoiceWorkspaceCount(inv, type){
  return inv.lines.filter(l=>(l.activityType||inv.activityType||'photo')===type).length;
}
// لیست نوع‌فعالیت‌هایی که واقعاً توی این فاکتور استفاده شدن (بر اساس ردیف‌ها)، به ترتیب ثابت
function invoiceActivityTypesUsed(inv){
  const order = WORKSPACES.map(w=>w.key);
  const set = new Set(inv.lines.map(l=>l.activityType || inv.activityType || 'photo'));
  return order.filter(t=>set.has(t));
}
function computeInvoiceTotals(inv){
  const linesTotal = inv.lines.reduce((s,l)=>{
    const qty = parseQty(l.qty);
    return s + invLineUnitPrice(l)*qty;
  },0);
  // قیمت تمام‌شده‌ی کل فاکتور — برای ردیف‌های دلخواه بدون «قیمت تمام‌شده» ثبت‌شده، صفر در نظر گرفته می‌شود
  // (یعنی هنوز نمی‌دونیم چقدر هزینه داشتن، پس فعلاً کل مبلغشون سود حساب می‌شه)
  const costTotal = inv.lines.reduce((s,l)=>{
    const qty = parseQty(l.qty);
    return s + invLineUnitCost(l)*qty;
  },0);
  const jobCostTotal = (inv.jobCosts||[]).reduce((s,c)=> s + (parseFloat(c.amount)||0), 0);
  let discount = 0;
  if(parseFloat(inv.discountPct)>0) discount += linesTotal*(parseFloat(inv.discountPct)/100);
  if(parseFloat(inv.discountAmount)>0) discount += parseFloat(inv.discountAmount);
  const netTotal = Math.max(0, linesTotal - discount); // مبلغ بعد از تخفیف و قبل از مالیات (مبنای درآمد و سود)
  const vatRate = inv.vatEnabled ? (parseFloat(inv.vatRate)||0) : 0;
  const vat = vatRate>0 ? Math.round(netTotal*vatRate/100) : 0;
  const grandTotal = netTotal + vat; // مبلغ قابل پرداخت مشتری (با مالیات)
  // اگر ردیف‌های واریزی ریز ثبت شده باشند، جمعشون ملاک است؛ وگرنه فیلد قدیمی «پرداخت‌شده» (برای فاکتورهای قبل از این نسخه)
  const payments = Array.isArray(inv.payments) ? inv.payments : [];
  const paid = payments.length>0 ? payments.reduce((s,p)=>s+(parseFloat(p.amount)||0),0) : (parseFloat(inv.paidAmount)||0);
  const balance = Math.max(0, grandTotal - paid);
  // اگر پرداختی بیشتر از جمع کل فاکتور باشد، آن مقدار اضافه به نفع مشتری (بستانکاری) است و نباید گم شود
  const overpaid = Math.max(0, paid - grandTotal);
  // سود قبل و بعد از تخفیف — تخفیف باید از سود کم بشه، نه این‌که وارد قیمت تمام‌شده (ضرر) بشه
  const profitBeforeDiscount = linesTotal - costTotal - jobCostTotal;
  const profitAfterDiscount = profitBeforeDiscount - discount;
  return {linesTotal, costTotal, jobCostTotal, profitBeforeDiscount, profitAfterDiscount, discount, netTotal, vat, vatRate, grandTotal, paid, balance, overpaid, payments};
}

// مانده/بدهی قبلی مشتری — مستقل از همین فاکتور، یعنی مانده‌ای که از قبل (فاکتورهای پیشین + واریزی‌ها) باقی مانده
// مثبت = مشتری بدهکار است (باید به ما بدهد) | منفی = مشتری بستانکار است (ما به او بدهکاریم)
// getBalance اختیاریه: توی لیست فاکتورها، نسخه‌ی حافظه‌دار customerBalanceMemoized پاس داده می‌شه تا برای
// مشتری‌های تکراری، حساب مانده از اول انجام نشه (روی لیست‌های بلند، تفاوت سرعت محسوسه)
function invoicePrevBalanceAuto(inv, getBalance){
  if(!inv.customerId) return 0;
  const balanceFn = getBalance || customerBalance;
  const bal = balanceFn(inv.customerId); // net>0 یعنی بستانکار، net<0 یعنی بدهکار
  let net = bal.net;
  // اگر همین فاکتور قبلاً ذخیره شده و در حالت final/paid است، مانده‌ی خودش را از حساب کلی مشتری کم می‌کنیم
  // تا «بدهی قبلی» فقط شامل فاکتورهای دیگر باشد، نه خود این فاکتور
  if(inv.id){
    const saved = invoices.find(i=>i.id===inv.id);
    if(saved && saved.status!=='draft' && saved.status!=='cancelled'){
      const t = computeInvoiceTotals(saved);
      // باید هم سمت بدهکاری (t.balance) و هم سمت اضافه‌پرداخت (t.overpaid) خودِ همین فاکتور خنثی بشه؛
      // قبلاً فقط t.balance برگردانده می‌شد و t.overpaid این فاکتور به‌اشتباه به‌عنوان «بستانکاری از فاکتور
      // قبلی» باقی می‌ماند و باعث دوبار حساب‌شدن اضافه‌پرداخت همین فاکتور در «مانده نهایی» می‌شد.
      net = net + Math.max(0, t.balance) - t.overpaid;
    }
  }
  return -net; // برگرداندن به فرم «بدهکاری مثبت»
}
function invoicePrevBalanceFinal(inv, getBalance){
  if(inv.prevBalanceUseManual) return parseFloat(inv.prevBalanceManual)||0;
  return invoicePrevBalanceAuto(inv, getBalance);
}

  // موقع باز کردن برای ویرایش، همون عدد رو به یک ردیف واریزی تبدیل می‌کنیم تا با اضافه‌کردن واریزی جدید گم نشه
  if((!Array.isArray(invDraft.payments) || invDraft.payments.length===0) && parseFloat(invDraft.paidAmount)>0){

  invActiveWorkspace = (invDraft.lines[0] && invDraft.lines[0].activityType) || invDraft.activityType || 'photo';

// کپی سریع یک فاکتور قدیمی — برای مشتری‌های تکراری که دوباره همون کالاها رو سفارش می‌دن، به‌جای این‌که از صفر
// همه‌ی ردیف‌ها رو بسازی، فقط تاریخ و پرداخت‌ها خالی می‌شه و بقیه (مشتری، ردیف‌ها، تخفیف، یادداشت) کپی می‌مونه
function duplicateInvoice(id){
  const inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  const clone = JSON.parse(JSON.stringify(inv));
  delete clone.id;
  clone.number = null; // شماره‌ی جدید موقع ذخیره گرفته می‌شه
  clone.status = 'draft';
  clone.date = todayStr();
  clone.validTo = '';
  clone.deliveryDueDate = '';
  clone.payments = [];
  clone.paidAmount = '';
  clone.prevBalanceUseManual = false;
  clone.prevBalanceManual = '';
  clone.prevBalanceNote = '';
  // آی‌دی تازه برای هر ردیف تا با فاکتور اصلی قاطی نشه
  clone.fileArchive = blankFileArchive();
  clone.editorId = ''; clone.editDue = ''; clone.editorHistory = [];
  clone.paymentPlan = (clone.paymentPlan||[]).map(r=>({...r, id: Date.now().toString()+Math.random().toString(36).slice(2,6)}));
  clone.jobCosts = (clone.jobCosts||[]).map(c=> ({...c, id: Date.now().toString()+Math.random().toString(36).slice(2), paid:false}));
  clone.lines = (clone.lines||[]).map(l=> ({...l, id: Date.now().toString()+Math.random().toString(36).slice(2)}));
  invDraft = clone;
  invActiveWorkspace = (invDraft.lines[0] && invDraft.lines[0].activityType) || invDraft.activityType || 'photo';
  editingInvId = null;
  invTab = 'edit';
}
function resolveInvoiceStatus(inv, targetStatus){
  let status = targetStatus || inv.status || 'draft';
  if(status==='final' || status==='paid'){
    const t = computeInvoiceTotals(inv);
    status = (t.grandTotal>0 && t.balance<=0) ? 'paid' : 'final';
  }
  return status;
}
function ensureCustomerLinked(invDraftObj){
  const name = (invDraftObj.customerName||'').trim();
  if(!name) return invDraftObj.customerId || '';
  // اگه قبلاً به یک مشتری موجود وصل شده، همان را نگه دار
  if(invDraftObj.customerId && customers.some(c=>c.id===invDraftObj.customerId)) return invDraftObj.customerId;
  // اگه اسم دقیقاً با یک مشتری موجود یکی بود، به همان وصل شود (بدون ساخت تکراری)
  const existing = customers.find(c=>c.name.trim()===name);
  if(existing) return existing.id;
  // وگرنه مشتری جدید ساخته شود
  const c = { id: Date.now().toString()+Math.random().toString(36).slice(2), name, phone: (invDraftObj.customerPhone||'').trim() };
  customers = [...customers, c];
  saveJSON(STORE_KEYS.customers, customers);
  return c.id;
}
function saveInvoiceDraft(targetStatus){
  if(!invDraft.customerName.trim() && invDraft.lines.every(l=>!invLineName(l))){
    alert('حداقل نام مشتری یا یک ردیف کالا را وارد کنید'); return;
  }
  // اگه تخفیف (چه از فیلد تخفیف، چه از فی توافقی هر ردیف) از سود این فاکتور بیشتر باشه، یعنی داره وارد قیمت
  // تمام‌شده (ضرر) میشه — اجازه ثبت نمی‌دیم
  const tCheck = computeInvoiceTotals(invDraft);
  if(tCheck.profitAfterDiscount<0){
    const reason = tCheck.discount>0
      ? 'تخفیف واردشده: ' + fmt(tCheck.discount) + ' تومان'
      : 'یکی از ردیف‌ها با تخفیف ردیف، پایین‌تر از قیمت تمام‌شده ثبت شده';
    alert('این فاکتور زیر قیمت تمام‌شده حساب می‌شه و ضرر داره.\nسود این فاکتور قبل از تخفیف: ' + fmt(tCheck.profitBeforeDiscount) + ' تومان\n' + reason + '\nبرای ثبت، تخفیف رو اصلاح کن.');
    return;
  }
  if(targetStatus==='final' && !invDraft.validTo){
    invDraft.validFrom = invDraft.date;
    invDraft.validTo = addMonths(invDraft.date, 1);
  }
  if(targetStatus==='final'){
    invDraft.customerId = ensureCustomerLinked(invDraft);
  }
  // لایه دفاعی: فقط زمانی فاکتور موجود را ویرایش (merge) کن که id واقعاً با همان فاکتور تطبیق داشته باشد
  // این از overwrite ناخواسته جلوگیری می‌کند، حتی اگر editingInvId به اشتباه از یک مسیر دیگر باقی مانده باشد
  const existingIdx = editingInvId ? invoices.findIndex(i=>i.id===editingInvId) : -1;
  if(editingInvId && existingIdx>=0 && invDraft.id && invDraft.id===editingInvId){
    const idx = existingIdx;
    const merged = {...invDraft, status: targetStatus || invDraft.status};
    merged.status = resolveInvoiceStatus(merged, merged.status);
    invoices[idx] = merged;
    if(merged.number!=null && !isNaN(merged.number) && merged.number>=invoiceSeq){
      invoiceSeq = merged.number + 1;
      saveJSON(STORE_KEYS.invoiceSeq, invoiceSeq);
    }
  } else {
    const num = (invDraft.number!=null && !isNaN(invDraft.number)) ? invDraft.number : invoiceSeq;
    invoiceSeq = Math.max(invoiceSeq, num + 1);
    saveJSON(STORE_KEYS.invoiceSeq, invoiceSeq);
    const inv = {...invDraft, id: Date.now().toString(), number: num, status: targetStatus || 'draft'};
    inv.status = resolveInvoiceStatus(inv, inv.status);
    invoices = [inv, ...invoices];
    editingInvId = inv.id;
  }
  if(invDraft.contractId){ const cc = contracts.find(x=>x.id===invDraft.contractId); if(cc && editingInvId){ cc.invoiceId = editingInvId; saveJSON(STORE_KEYS.contracts, contracts); } }
  saveJSON(STORE_KEYS.invoices, invoices);
  invTab = 'list';
  render();
}
function deleteInvoice(id){
  invoices = invoices.filter(i=>i.id!==id);
  bookings.forEach(b=>{ if(b.invoiceId===id) b.invoiceId = ''; }); saveBookings();
  saveJSON(STORE_KEYS.invoices, invoices);
  render();
}
function cycleInvoiceStatusInList(id){
  const idx = invoices.findIndex(i=>i.id===id);
  if(idx<0) return;
  const cur = invoices[idx].status;
  const order = {draft:'final', final:'paid', paid:'cancelled', cancelled:'draft'};
  invoices[idx].status = order[cur] || 'draft';
  saveJSON(STORE_KEYS.invoices, invoices);
  render();
}

function isHexColor(v){ return /^#[0-9a-fA-F]{6}$/.test(v||''); }
function hexMix(a, b, t){ // t = سهم رنگ b
  const pa = [1,3,5].map(i=>parseInt(a.slice(i,i+2),16)), pb = [1,3,5].map(i=>parseInt(b.slice(i,i+2),16));
  return '#' + pa.map((v,i)=>Math.round(v*(1-t)+pb[i]*t).toString(16).padStart(2,'0')).join('');
}
function applyAppTheme(){
  const root = document.documentElement.style;

  const props = ['--c-accent','--c-accent-soft','--c-ink','--c-ink-soft','--c-steel','--c-bg','--c-surface'];
  if(isDefault){ props.forEach(k=>root.removeProperty(k)); return; }
  const accent = custom || p.accent;
  root.setProperty('--c-accent', accent);

  root.setProperty('--c-steel', hexMix(p.ink, '#ffffff', 0.34));

          if(!window.__bio.avail) return `<p class="note" style="margin:0 0 14px;text-align:right;line-height:1.9">این دستگاه یا مرورگر قفل بایومتریک (اثر انگشت/چهره) ندارد یا برای وب‌سایت‌ها فعالش نکرده است. ابتدا در تنظیمات گوشی اثر انگشت یا چهره را ثبت کن و قفل صفحه بگذار.</p>`;

function bindSecurityEvents(){
  document.getElementById('secToggle')?.addEventListener('click', async ()=>{ try{ window.__bio.avail = await window.__bio.available(); }catch(e){} securityOpen = !securityOpen; render(); });
  document.getElementById('secAutolock')?.addEventListener('change', e=>{ window.__vault.setAutolock(parseInt(e.target.value)||0); });
  document.getElementById('secLockNow')?.addEventListener('click', ()=> window.__vault.lock(true));
  document.getElementById('secBioOff')?.addEventListener('click', async ()=>{ await window.__bio.disable(); render(); });
  document.getElementById('secBioOn')?.addEventListener('click', async ()=>{
    const pw = document.getElementById('secBioPw').value;
    if(!pw){ alert('اول رمز ورود را وارد کن'); return; }
    const btn = document.getElementById('secBioOn'); btn.disabled = true; btn.textContent = 'منتظر تأیید گوشی...';
    try {
      const r = await window.__bio.enroll(pw);
      if(!r.ok){ alert('رمز درست نیست'); }
      else { alert(r.mode==='prf' ? 'ورود با اثر انگشت/چهره فعال شد (حالت امن).' : 'ورود با اثر انگشت/چهره فعال شد (حالت راحتی). این گوشی قفل رمزنگاری بایومتریک را پشتیبانی نمی‌کند.'); }
    } catch(e){ alert('فعال‌سازی انجام نشد (لغو شد یا گوشی اجازه نداد).'); }
    render();
  });
  document.getElementById('secChangeBtn')?.addEventListener('click', async ()=>{
    const o = document.getElementById('secOldPw').value, n = document.getElementById('secNewPw').value, n2 = document.getElementById('secNewPw2').value;
    if(!o){ alert('رمز فعلی را وارد کن'); return; }
    if(n.length < 6){ alert('رمز جدید باید حداقل ۶ کاراکتر باشد'); return; }
    if(n !== n2){ alert('تکرار رمز جدید یکسان نیست'); return; }
    const btn = document.getElementById('secChangeBtn'); btn.disabled = true; btn.textContent = 'در حال تغییر...';
    const ok = await window.__vault.changePassword(o, n);
    btn.disabled = false; btn.textContent = 'تغییر رمز';
    if(ok){ ['secOldPw','secNewPw','secNewPw2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; }); const hadBio = !!window.__bio.config(); if(hadBio) await window.__bio.disable(); alert('رمز ورود تغییر کرد. دفعه‌ی بعد با رمز جدید وارد شو.' + (hadBio ? '\nورود با اثر انگشت/چهره برای رمز جدید غیرفعال شد؛ در همین بخش دوباره فعالش کن.' : '')); render(); }
    else alert('رمز فعلی درست نیست');
  });
}

function renderInvoiceListTab(){
  if(invoices.length===0){
    return renderBankInfoSettings() + `<p class="empty">هنوز فاکتوری ثبت نشده</p>
    <button id="newInvBtn" class="btn btn-red" style="width:100%">+ فاکتور جدید</button>`;
  }
  const q = toLatinDigits(invSearchQuery.trim().toLowerCase());
  const filtered = invoices.filter(inv=>{
    if(!invoiceMatchesQuickFilter(inv)) return false;
    if(!q) return true;
    const name = (inv.customerName||'').toLowerCase();
    const phone = toLatinDigits(inv.customerPhone||'');
    const code = toLatinDigits((inv.projectCode||'').toLowerCase());
    const codeDisplay = toLatinDigits(projectCodeDisplay(inv.projectCode).toLowerCase());
    const numStr = toLatinDigits(invNumStr(inv.number)||'');
    const numRaw = String(inv.number!=null? inv.number : '');
    const dateG = (inv.date||'');
    const dateJ = toLatinDigits(jalaliStr(inv.date)||'');
    const pStatus = (PROJECT_STATUS_LABELS[inv.projectStatus]||'').toLowerCase();
    const status = (STATUS_LABELS[inv.status]||'').toLowerCase();
    const media = toLatinDigits(((inv.fileArchive&&inv.fileArchive.media)||'').toLowerCase());
    return media.includes(q) || name.includes(q) || phone.includes(q) || code.includes(q) || codeDisplay.includes(q) ||
           numStr.includes(q) || numRaw.includes(q) ||
           dateG.includes(q) || dateJ.includes(q) || pStatus.includes(q) || status.includes(q);
  }).sort((a,b)=> (b.number||0)-(a.number||0)); // جدیدترین فاکتور (بیشترین شماره) همیشه بالای لیست
  // فقط تا سقف invListVisibleCount کارت واقعاً ساخته و محاسبه می‌شن؛ محاسبه‌ی مانده‌حساب هر فاکتور (که خودش
  // باید حساب کل فاکتورهای همون مشتری رو بررسی کنه) گرون‌ترین بخش این صفحه‌ست، پس محدودش می‌کنیم
  const visible = filtered.slice(0, invListVisibleCount);
  const balCache = new Map();
  const getBalance = customerBalanceMemoized(balCache);
  const quickFilterLabel = invQuickFilter==='active' ? 'پروژه‌های فعال' : (invQuickFilter==='drafts' ? 'پیش‌فاکتورهای باز' : null);
  return `
    ${renderBankInfoSettings()}
    <button id="newInvBtn" class="btn btn-red" style="width:100%;margin-bottom:10px">+ فاکتور جدید</button>
    ${quickFilterLabel ? `<div class="row-flex" style="margin-bottom:10px;align-items:center">
      <span style="flex:1;font-weight:700;font-size:13px">فیلتر: ${quickFilterLabel}</span>
      <button id="invClearQuickFilterBtn" class="btn btn-outline" style="font-size:12px">حذف فیلتر ×</button>
    </div>` : ''}
    <input id="invSearchInput" placeholder="🔍 جستجو: شماره فاکتور، نام/تلفن مشتری، شماره هارد/فلش، تاریخ یا وضعیت" value="${escapeAttr(invSearchQuery)}" style="width:100%;margin-bottom:10px;border:1.5px solid #000">
    ${filtered.length===0? '<p class="empty">نتیجه‌ای پیدا نشد</p>' : visible.map(inv=>{
      const t = computeInvoiceTotals(inv);
      const prevBal = invoicePrevBalanceFinal(inv, getBalance);
      const statusCls = inv.status==='final'?'final':(inv.status==='paid'?'paid':(inv.status==='cancelled'?'cancelled':'draft'));
      const balLine = t.balance>0 ? `<span style="color:var(--red);font-weight:700">مانده: ${fmt(t.balance)} ت</span>`
        : (t.overpaid>0 ? `<span style="color:#1A7A3A;font-weight:700">اضافه‌پرداخت: ${fmt(t.overpaid)} ت</span>`
        : `<span style="color:#1A7A3A;font-weight:700">تسویه کامل</span>`);
      const prevLine = prevBal>0 ? `<span style="color:var(--red);font-weight:700">مانده قبلی: ${fmt(prevBal)} ت</span>`
        : (prevBal<0 ? `<span style="color:#1A7A3A;font-weight:700">اضافه‌دریافت قبلی: ${fmt(-prevBal)} ت</span>` : '');
      const netDue = t.balance + prevBal; // جمع کل واقعی که مشتری الان باید پرداخت کنه (یا بستانکاره)
      const bd = invoiceCostBreakdown(inv);
      const costLine = (inv.status!=='cancelled' && bd.totalCost>0)
        ? `<div class="grid2" style="margin-top:6px;padding-top:6px;border-top:1px dashed #E5E5E5;font-size:12px"><span style="color:#6B7075">هزینه: ${fmt(bd.totalCost)} ت</span><span style="font-weight:700;color:${bd.profit>=0?'#1A7A3A':'var(--red)'}">${bd.profit>=0?'سود':'ضرر'}: ${fmt(Math.abs(bd.profit))} ت</span></div>` : '';
      const totalLine = netDue>0
        ? `<div class="r-row bold accent" style="margin-top:4px"><span>جمع کل قابل پرداخت</span><span>${fmt(netDue)} ت</span></div>`
        : (netDue<0
          ? `<div class="r-row bold" style="margin-top:4px;color:#1A7A3A"><span>جمع کل (بستانکار مشتری)</span><span>${fmt(-netDue)} ت</span></div>`
          : '');
      return `<div class="card inv-card" data-row-id="${inv.id}">
        <div class="card-title">
          <span>#${invNumStr(inv.number)} — ${escapeAttr(inv.customerName||'بدون نام')}</span>

function timeFieldHTML(id, value, extraStyle){
  return `<input type="text" id="${id}" inputmode="numeric" autocomplete="off" dir="ltr" maxlength="5" placeholder="18:30" value="${escapeAttr(value||'')}" style="text-align:center;letter-spacing:.08em;${extraStyle||''}">`;
}
function liveTimeText(raw, deleting){
  let d = toLatinDigits(String(raw||'')).replace(/[^0-9]/g,'').slice(0,4);
  if(!d) return '';
  if(d[0] > '2') d = ('0' + d).slice(0,4);                                         // ۹ ← ۰۹
  else if(d.length>=2 && parseInt(d.slice(0,2)) > 23) d = ('0' + d[0] + d.slice(1)).slice(0,4);
  if(d.length>=3 && d[2] > '5') d = (d.slice(0,2) + '0' + d.slice(2)).slice(0,4);   // ۱۸:۷ ← ۱۸:۰۷
  if(d.length<=1) return d;
  if(d.length===2) return deleting ? d : d + ':';
  return d.slice(0,2) + ':' + d.slice(2);
}
function finalTimeText(raw){
  let d = toLatinDigits(String(raw||'')).replace(/[^0-9]/g,'').slice(0,4);
  if(!d) return '';
  if(d.length<=2) d = d.padStart(2,'0') + '00'; else if(d.length===3) d = '0' + d;
  const h = Math.min(23, parseInt(d.slice(0,2))), m = Math.min(59, parseInt(d.slice(2)));
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function bindTimeField(id, onChange){
  const el = document.getElementById(id); if(!el) return;
  el.addEventListener('input', e=>{
    const v = liveTimeText(e.target.value, (e.inputType||'').startsWith('delete'));
    e.target.value = v; onChange(/^\d{2}:\d{2}$/.test(v) ? v : '');
  });
  el.addEventListener('blur', e=>{ const v = finalTimeText(e.target.value); e.target.value = v; onChange(v); });
  el.addEventListener('focus', e=>{ try{ e.target.select(); }catch(x){} });
}

function bkNormalize(b){
  if(!Array.isArray(b.crew)){
    const ids = b.resourceIds||[];
    b.spaceIds = ids.filter(id=>{ const r = bookingResources.find(x=>x.id===id); return r && r.kind==='space'; });
    b.crew = ids.filter(id=>staff.some(x=>x.id===id)).map(id=>{ const st = staff.find(x=>x.id===id); return { id: ctUid(), staffId:id, role:(st.roles&&st.roles[0])||'', callTime:'', gearIds:[], note:'' }; });
    b.extraGear = ids.filter(id=>equipment.some(x=>x.id===id));
  }
  if(!Array.isArray(b.spaceIds)) b.spaceIds = [];
  if(!Array.isArray(b.extraGear)) b.extraGear = [];
  return b;
}
function bkRecomputeResources(b){
  const set = new Set([...(b.spaceIds||[]), ...(b.extraGear||[])]);
  (b.crew||[]).forEach(m=>{ if(m.staffId) set.add(m.staffId); (m.gearIds||[]).forEach(g=>set.add(g)); });
  b.resourceIds = [...set];
  return b;
}
function bkEarliestCall(b){
  const vals = (b.crew||[]).map(m=>bkToMin(m.callTime)).filter(v=>!isNaN(v));
  return vals.length ? Math.min(...vals) : NaN;
}

function bkToMin(t){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m ? (+m[1])*60 + (+m[2]) : NaN; }
// بازه‌ی زمانی مطلق (دقیقه) — اگر پایان قبل از شروع باشد یعنی مراسم از نیمه‌شب گذشته و تا فردا ادامه دارد
function bkInterval(b){
  const day = Date.parse(b.date + 'T00:00:00Z') / 60000;
  const st0 = bkToMin(b.start), e0 = bkToMin(b.end), call = bkEarliestCall(b);
  if(isNaN(day) || isNaN(st0) || isNaN(e0)) return null;
  const s0 = (!isNaN(call) && call < st0) ? call : st0;       // فرد از ساعت حضورش درگیر است، نه از ساعت شروع مراسم
  return [day + s0, day + (e0 <= st0 ? e0 + 1440 : e0)];
}
function bkResName(id){ const r = bookingResources.find(x=>x.id===id); return r ? r.name : '؟'; }
// تداخل فقط وقتی است که زمان‌ها هم‌پوشانی داشته باشند و حداقل یک منبع (فضا/نفر/تجهیزات) مشترک باشد
function bookingConflicts(b, excludeId){
  const iv = bkInterval(b);
  if(!iv || !(b.resourceIds||[]).length || b.status==='cancelled') return [];
  const out = [];
  bookings.forEach(o=>{
    if(o.id===excludeId || o.status==='cancelled') return;
    const oi = bkInterval(o);
    if(!oi || !(iv[0] < oi[1] && oi[0] < iv[1])) return;
    const shared = (o.resourceIds||[]).filter(id=>b.resourceIds.includes(id));
    if(shared.length) out.push({ booking:o, shared });
  });
  return out;
}
// تداخل یک منبع (فرد یا تجهیزات) مشخص با آفیش‌های دیگر
function bkResourceConflicts(id, b, excludeId){
  const iv = bkInterval(b);
  if(!iv || b.status==='cancelled') return [];
  return bookings.filter(o=>{
    if(o.id===excludeId || o.status==='cancelled' || !(o.resourceIds||[]).includes(id)) return false;
    const oi = bkInterval(o); return oi && iv[0] < oi[1] && oi[0] < iv[1];
  });
}

}

  lines.push(`محل: ${BOOKING_PLACES[b.place]||''}${b.placeNote ? ' — ' + b.placeNote : ''}`);
  const crew = (b.crew||[]).filter(m=>m.staffId);
  if(crew.length){ lines.push('', '👥 اکیپ:'); crew.forEach((m,i)=>{ const st = staff.find(x=>x.id===m.staffId); const gear = (m.gearIds||[]).map(id=>bkResName(id).replace(/ \(.*\)$/,'')).join('، ');

function bkConflictText(list){
  return list.map(c=>`«${c.booking.title||c.booking.customerName||'آفیش'}» (${jalaliStr(c.booking.date)} — ${toPersianDigits(c.booking.start)} تا ${toPersianDigits(c.booking.end)}) روی: ${c.shared.map(bkResName).join('، ')}`).join('\n');
}
function bkTimeStr(b){ return toPersianDigits(b.start) + ' تا ' + toPersianDigits(b.end); }
function bkWeekday(dateStr){ const d = new Date(dateStr + 'T12:00:00'); return isNaN(d) ? '' : WEEKDAYS_FA[d.getDay()]; }
function bkAddDays(dateStr, n){ const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function bkIsOpen(b){ return b.status!=='cancelled' && b.status!=='done'; }
function bookingsUpcomingCount(days){
  const t = todayStr(), end = bkAddDays(t, days);
  return bookings.filter(b=> bkIsOpen(b) && b.date>=t && b.date<=end).length;
}

function renderBookingsTab(){

  else if(bkFilter==='past') list = list.filter(b=> b.date<t || b.status==='done' || b.status==='cancelled').sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
  else list.sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));
  const groups = {}; const order = [];

        ${bookingResources.filter(r=>r.kind==='space').map(r=>`<div class="row-flex" style="margin-bottom:6px;align-items:center"><span style="flex:1">${escapeAttr(r.name)}</span><button class="btn-icon bk-res-del" data-id="${r.id}">×</button></div>`).join('') || '<p class="note">فضایی تعریف نشده</p>'}

function bkLeaveForm(){

function updateBkConflictHint(){

function bindBookingsEvents(){
  document.getElementById('bkNewBtn')?.addEventListener('click', ()=>{ bkDraft = blankBooking(); editingBookingId = null; bkView = 'form'; render(); });
  document.querySelectorAll('.bk-filter').forEach(el=> el.addEventListener('click', e=>{ bkFilter = e.currentTarget.dataset.f; render(); }));
  document.querySelectorAll('.bk-edit').forEach(el=> el.addEventListener('click', e=>{
    const b = bookings.find(x=>x.id===e.currentTarget.dataset.id); if(!b) return;
    bkDraft = bkNormalize(JSON.parse(JSON.stringify(b))); editingBookingId = b.id; bkView = 'form'; render();
  }));
  document.querySelectorAll('.bk-status-quick').forEach(el=> el.addEventListener('change', e=>{
    const b = bookings.find(x=>x.id===e.target.dataset.id); if(!b) return;
    b.status = e.target.value; saveBookings(); render();
  }));
  document.querySelectorAll('.bk-open-inv').forEach(el=> el.addEventListener('click', e=>{

    saveBookingResources(); bkResDraft = { name:'', kind: bkResDraft.kind }; render();
  });
  document.querySelectorAll('.bk-res-del').forEach(el=> el.addEventListener('click', e=>{
    const id = e.currentTarget.dataset.id;
    if(!confirm('این منبع حذف شود؟ از همه آفیش‌ها هم برداشته می‌شود.')) return;
    bookingResources = bookingResources.filter(r=>r.id!==id); saveBookingResources();
    bookings.forEach(b=>{ b.resourceIds = (b.resourceIds||[]).filter(x=>x!==id); }); saveBookings(); render();
  }));
  if(bkView!=='form' || !bkDraft) return;

  document.getElementById('bkInvoice')?.addEventListener('change', e=>{
    bkDraft.invoiceId = e.target.value;
    const inv = invoices.find(i=>i.id===e.target.value);
    if(inv && !bkDraft.customerName.trim()){ bkDraft.customerName = inv.customerName || ''; const c = document.getElementById('bkCustomer'); if(c) c.value = bkDraft.customerName; }
  });
  bindJalaliDateInput('bkDate', iso=>{ bkDraft.date = iso; updateBkConflictHint(); });
  bindTimeField('bkStart', v=>{ bkDraft.start = v; updateBkConflictHint(); });
  bindTimeField('bkEnd', v=>{ bkDraft.end = v; updateBkConflictHint(); });
  document.getElementById('bkPlace')?.addEventListener('change', e=>{ bkDraft.place = e.target.value; });
  document.getElementById('bkPlaceNote')?.addEventListener('input', e=>{ bkDraft.placeNote = e.target.value; });
  document.getElementById('bkStatus')?.addEventListener('change', e=>{ bkDraft.status = e.target.value; updateBkConflictHint(); });
  document.getElementById('bkNote')?.addEventListener('input', e=>{ bkDraft.note = e.target.value; });
  const bcrew = bkDraft, redo = ()=>{ bkRecomputeResources(bcrew); render(); };
  document.getElementById('bkAddCrew')?.addEventListener('click', ()=>{ bcrew.crew.push({ id: ctUid(), staffId:'', role:'', callTime: bcrew.start||'', gearIds:[], note:'' }); redo(); });
  document.querySelectorAll('.bk-crew-staff').forEach(el=> el.addEventListener('change', e=>{ const m = bcrew.crew[+e.target.dataset.i]; m.staffId = e.target.value; const st = staff.find(x=>x.id===m.staffId); if(st && (!m.role || !(st.roles||[]).includes(m.role))) m.role = (st.roles&&st.roles[0])||''; redo(); }));
  document.querySelectorAll('.bk-crew-role').forEach(el=> el.addEventListener('change', e=>{ bcrew.crew[+e.target.dataset.i].role = e.target.value; updateBkConflictHint(); }));
  document.querySelectorAll('.bk-crew-del').forEach(el=> el.addEventListener('click', e=>{ bcrew.crew.splice(+e.currentTarget.dataset.i,1); redo(); }));

  document.querySelectorAll('.bk-crew-gear').forEach(el=> el.addEventListener('click', e=>{ const m = bcrew.crew[+e.currentTarget.dataset.i], id = e.currentTarget.dataset.id; const set = new Set(m.gearIds||[]); set.has(id) ? set.delete(id) : set.add(id); m.gearIds = [...set]; redo(); }));
  document.querySelectorAll('.bk-xgear').forEach(el=> el.addEventListener('click', e=>{ const id = e.currentTarget.dataset.id; const set = new Set(bcrew.extraGear||[]); set.has(id) ? set.delete(id) : set.add(id); bcrew.extraGear = [...set]; redo(); }));
  document.querySelectorAll('.bk-space').forEach(el=> el.addEventListener('click', e=>{ const id = e.currentTarget.dataset.id; const set = new Set(bcrew.spaceIds||[]); set.has(id) ? set.delete(id) : set.add(id); bcrew.spaceIds = [...set]; redo(); }));
  (bcrew.crew||[]).forEach((m,i)=> bindTimeField('bkCall-'+i, v=>{ m.callTime = v; updateBkConflictHint(); }));
  document.getElementById('bkCrewWrap')?.addEventListener('click', e=>{ const t = e.target.closest('.bk-crew-swap'); if(!t) return; const m = bcrew.crew[+t.dataset.i]; m.staffId = t.dataset.id; const st = staff.find(x=>x.id===m.staffId); if(st && !(st.roles||[]).includes(m.role)) m.role = (st.roles&&st.roles[0])||m.role; redo(); });
  document.getElementById('bkShareTxt')?.addEventListener('click', ()=> shareDispatchText(bkRecomputeResources(bkDraft)));
  document.getElementById('bkDispPrev')?.addEventListener('click', ()=> previewDispatch(bkRecomputeResources(bkDraft)));
  document.getElementById('bkSaveBtn')?.addEventListener('click', ()=>{
    bkRecomputeResources(bkDraft);

    if(!bkDraft.date){ alert('تاریخ را مشخص کنید'); return; }
    if(isNaN(bkToMin(bkDraft.start)) || isNaN(bkToMin(bkDraft.end))){ alert('ساعت شروع و پایان را وارد کنید'); return; }

    const conf = bookingConflicts(bkDraft, editingBookingId);

    if(editingBookingId){

  });
}


/* ===== تجهیزات و استهلاک ===== */
const EQUIP_KINDS = { camera:'دوربین', lens:'لنز', light:'نور و فلاش', audio:'صدا', drone:'پهپاد / هلی‌شات', other:'سایر' };
const EQUIP_UNITS = { hours:'ساعت', shots:'شات' };
let equipDraft = { name:'', kind:'camera', price:'', salvage:'', lifeUnit:'hours', life:'', status:'ready', note:'' };
let equipEditingId = null;
// نرخ استهلاک هر واحد (ساعت یا شات) = (قیمت خرید − ارزش باقی‌مانده) ÷ عمر مفید
function equipRate(e){
  const price = parseFloat(e.price)||0, salvage = parseFloat(e.salvage)||0, life = parseFloat(e.life)||0;
  return life>0 ? Math.max(0, price - salvage)/life : 0;
}
function equipUsage(id){
  let used = 0;
  invoices.forEach(inv=>{
    if(inv.status!=='final' && inv.status!=='paid') return;
    (inv.jobCosts||[]).forEach(c=>{ if(c.kind==='depreciation' && c.equipmentId===id) used += parseFloat(c.qty)||0; });
  });
  return used;
}
function depCost(equipmentId, qty){
  const e = equipment.find(x=>x.id===equipmentId);
  return e ? Math.round(equipRate(e)*(parseFloat(qty)||0)) : 0;
}

  const f = equipDraft;
  return `

    <div class="box-gray" style="margin-bottom:14px">

      <div class="row-flex" style="margin-bottom:8px">

      <button id="eqSaveBtn" class="btn btn-black" style="width:100%">${equipEditingId?'ذخیره تغییرات':'+ افزودن تجهیزات'}</button>

        ${parseFloat(e.price)>0 ? `<div class="card-sub">خرید: ${fmt(e.price)} ت${life>0 ? ' — استهلاک هر '+EQUIP_UNITS[e.lifeUnit]+': '+fmt(Math.round(equipRate(e)))+' ت' : ''}</div>` : ''}

        </div>
      </div>`;
    }).join('')}
  `;

/* ===== هزینه و سود هر فاکتور — منبع واحد برای فاکتور، داشبورد، گزارش و تب هزینه‌ها ===== */
function jobKindLabel(k){ const x = JOB_COST_KINDS.find(a=>a[0]===k); return x ? x[1] : 'سایر'; }
function invoiceCostBreakdown(inv){
  const t = computeInvoiceTotals(inv);
  const byKind = {};
  (inv.jobCosts||[]).forEach(c=>{ const a = parseFloat(c.amount)||0; if(a>0) byKind[c.kind] = (byKind[c.kind]||0) + a; });
  const revenue = t.netTotal, itemCost = t.costTotal, jobTotal = t.jobCostTotal, profit = t.profitAfterDiscount;
  return { revenue, itemCost, jobTotal, byKind, profit, margin: revenue>0 ? profit/revenue*100 : 0, totalCost: itemCost + jobTotal };
}
function renderInvoiceCostPanel(inv){
  const bd = invoiceCostBreakdown(inv), neg = bd.profit < 0;
  const kinds = Object.entries(bd.byKind);
  return `<div class="card" style="margin:0 0 12px;${neg?'border-color:var(--red)':''}">
    <div class="card-title"><span>خلاصه هزینه و سود این فاکتور</span></div>
    <div class="grid2" style="margin-top:6px">
      <span>فروش (بعد از تخفیف، بدون مالیات)</span><span>${fmt(bd.revenue)} ت</span>
      ${bd.itemCost>0 ? `<span>هزینه تمام‌شده اقلام</span><span style="color:var(--red)">${fmt(bd.itemCost)}- ت</span>` : ''}
      <span>هزینه‌های اجرا</span><span style="color:var(--red)">${fmt(bd.jobTotal)}- ت</span>
      ${kinds.map(([k,v])=>`<span style="font-size:11px;color:#6B7075">↳ ${jobKindLabel(k)}</span><span style="font-size:11px;color:#6B7075">${fmt(v)} ت</span>`).join('')}
    </div>
    <div class="r-row bold" style="margin-top:8px;color:${neg?'var(--red)':'#1A7A3A'}"><span>سود خالص این فاکتور</span><span>${fmt(Math.abs(bd.profit))} تومان${neg?' (ضرر)':''}${bd.revenue>0 ? ' — '+toPersianDigits(Math.round(bd.margin))+'٪' : ''}</span></div>
    <p class="note" style="margin:8px 0 0;text-align:right;line-height:1.9">${inv.status==='draft' ? 'این فاکتور هنوز پیش‌فاکتور است؛ بعد از «صدور» هزینه‌ها و سودش در داشبورد، گزارش و تب هزینه‌ها هم حساب می‌شود.' : 'این هزینه‌ها در داشبورد، گزارش‌ها و تب «هزینه‌ها ← هزینه فاکتورها» هم دیده می‌شود.'}</p>
  </div>`;
}
function invoiceJobCostRows(){
  const rows = [];
  invoices.forEach(inv=>{
    if(inv.status!=='final' && inv.status!=='paid') return;
    (inv.jobCosts||[]).forEach(c=>{
      const a = parseFloat(c.amount)||0;
      if(a>0) rows.push({ id:'jc-'+inv.id+'-'+c.id, isJob:true, invId:inv.id, invNumber:inv.number, customer:inv.customerName||'', kind:c.kind,
        categoryName: c.title || jobKindLabel(c.kind), date: inv.date, tag:'business', amount:a, note:'' });
    });
  });
  return rows;
}
function monthInvoiceCosts(){
  const ms = jalaliMonthStartISO(), td = todayStr(), byKind = {}; let total = 0;
  invoices.forEach(inv=>{
    if((inv.status!=='final' && inv.status!=='paid') || inv.date<ms || inv.date>td) return;
    (inv.jobCosts||[]).forEach(c=>{ const a = parseFloat(c.amount)||0; if(a>0){ byKind[c.kind] = (byKind[c.kind]||0)+a; total += a; } });
  });
  return { total, byKind };
}
function monthProfitSummary(){
  const ms = jalaliMonthStartISO(), td = todayStr();
  const counted = invoices.filter(inv=> (inv.status==='final'||inv.status==='paid') && inv.date>=ms && inv.date<=td);
  let revenue=0, itemCost=0, jobCost=0, gross=0;
  counted.forEach(inv=>{ const bd = invoiceCostBreakdown(inv); revenue += bd.revenue; itemCost += bd.itemCost; jobCost += bd.jobTotal; gross += bd.profit; });
  const general = expenses.filter(e=> e.tag==='business' && e.date>=ms && e.date<=td).reduce((a,e)=>a+Math.max(0,parseFloat(e.amount)||0),0);
  return { revenue, itemCost, jobCost, general, gross, net: gross - general, count: counted.length };
}
function expJobRowHTML(e){
  return `<div class="card" data-row-id="${e.id}">
    <div class="card-title"><span>${escapeAttr(e.categoryName)}</span><span class="badge-activity">هزینه فاکتور</span></div>
    <div class="card-sub">${jalaliStr(e.date)} — فاکتور #${invNumStr(e.invNumber)} ${escapeAttr(e.customer)} — ${jobKindLabel(e.kind)}</div>

  </div>`;
}

function contractTotals(ct){

  const vat = vatRate>0 ? Math.round(net*vatRate/100) : 0;
