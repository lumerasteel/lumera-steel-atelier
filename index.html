function saveContractDraft(){
  const c = ctDraft;
  if(!c.customerName.trim() && !c.title.trim()){ alert('حداقل نام مشتری یا عنوان پروژه را وارد کن'); return false; }
  if(ctEditingId){ const i = contracts.findIndex(x=>x.id===ctEditingId); if(i>=0) contracts[i] = { ...c, id: ctEditingId, number: contracts[i].number }; }
  else { const rec = { ...c, id: ctUid(), number: nextContractNumber() }; contracts.unshift(rec); ctEditingId = rec.id; ctDraft = ctClone(rec); }
  saveJSON(STORE_KEYS.contracts, contracts);
  return true;
}
function bindContractsEvents(){
  const open = id=>{ const c = contracts.find(x=>x.id===id); if(c){ ctDraft = ctClone(c); ctEditingId = c.id; ctView = 'edit'; render(); } };
  document.getElementById('ctNewBtn')?.addEventListener('click', ()=>{ ctDraft = blankContract(); ctEditingId = null; ctView = 'edit'; render(); });
  document.getElementById('ctTplBtn')?.addEventListener('click', ()=>{ ctTplDraft = ctClone(contractTpl); ctView = 'tpl'; render(); });
  document.querySelectorAll('.ct-edit').forEach(el=> el.addEventListener('click', e=> open(e.currentTarget.dataset.id)));
  document.querySelectorAll('.ct-status').forEach(el=> el.addEventListener('change', e=>{ const c = contracts.find(x=>x.id===e.target.dataset.id); if(c){ c.status = e.target.value; saveJSON(STORE_KEYS.contracts, contracts); } }));
  document.querySelectorAll('.ct-delete').forEach(el=> el.addEventListener('click', e=>{ if(!confirm('این قرارداد حذف شود؟')) return; contracts = contracts.filter(x=>x.id!==e.currentTarget.dataset.id); saveJSON(STORE_KEYS.contracts, contracts); render(); }));
  document.querySelectorAll('.ct-preview').forEach(el=> el.addEventListener('click', e=>{ const c = contracts.find(x=>x.id===e.currentTarget.dataset.id); if(c) previewContract(c); }));
  document.querySelectorAll('.ct-jpg').forEach(el=> el.addEventListener('click', e=>{ const c = contracts.find(x=>x.id===e.currentTarget.dataset.id); if(c) exportContractJPG(c, e.currentTarget); }));
  document.querySelectorAll('.ct-print').forEach(el=> el.addEventListener('click', e=>{ const c = contracts.find(x=>x.id===e.currentTarget.dataset.id); if(c) printContract(c); }));
  document.querySelectorAll('.ct-open-inv').forEach(el=> el.addEventListener('click', e=>{ navBackStack.push('contracts'); tab='invoice'; loadInvoiceForEdit(e.currentTarget.dataset.id); render(); }));
  if(ctView==='tpl' && ctTplDraft) return bindContractTplEvents();
  if(ctView!=='edit' || !ctDraft) return;
  const c = ctDraft, upd = ()=>{ const el = document.getElementById('ctTotals'); if(el) el.innerHTML = ctTotalsHTML(c); };
  const num = v => toLatinDigits(v);
  document.getElementById('ctBackBtn')?.addEventListener('click', ()=>{ ctView='list'; ctDraft=null; ctEditingId=null; render(); });
  document.getElementById('ctInvFill')?.addEventListener('click', ()=>{ const inv = invoices.find(i=>i.id===document.getElementById('ctInvPick').value); if(!inv){ alert('اول یک فاکتور انتخاب کن'); return; } ctFillFromInvoice(c, inv); render(); });
  document.getElementById('ctCustPick')?.addEventListener('change', e=>{ const x = customers.find(q=>q.id===e.target.value); if(x){ c.customerName = x.name||''; c.customerPhone = x.phone||''; render(); } });
  [['ctCustName','customerName'],['ctCustPhone','customerPhone'],['ctCustNid','customerNationalId'],['ctCustAddr','customerAddress'],['ctTitle','title'],['ctPlace','place'],['ctExtra','extraNote']]
    .forEach(([id,k])=> document.getElementById(id)?.addEventListener('input', e=>{ c[k] = e.target.value; }));
  bindJalaliDateInput('ctDate', iso=>{ c.date = iso; });
  bindJalaliDateInput('ctEventDate', iso=>{ c.eventDate = iso; });
  bindTimeField('ctStart', v=>{ c.start = v; });
  bindTimeField('ctEnd', v=>{ c.end = v; });

  document.querySelectorAll('.ctl-price').forEach(el=> el.addEventListener('input', e=>{ c.lines[+e.target.dataset.idx].price = num(e.target.value); upd(); }));
  document.querySelectorAll('.ctl-cost').forEach(el=> el.addEventListener('input', e=>{ c.lines[+e.target.dataset.idx].cost = num(e.target.value); upd(); }));
  document.querySelectorAll('.ctl-remove').forEach(el=> el.addEventListener('click', e=>{ c.lines.splice(+e.currentTarget.dataset.idx,1); if(!c.lines.length) c.lines = blankContract().lines; render(); }));

  document.getElementById('ctAddProduct')?.addEventListener('change', e=>{
    const v = e.target.value;
    let line;
    if(v.startsWith('tf:')){ const t = tariff.find(x=>x.id===v.slice(3)); if(!t) return; line = { id: ctUid(), productId:'', desc: tariffLabel(t), qty:'1', price: String(ctNum(t.price)), cost: ctNum(t.cost)>0 ? String(ctNum(t.cost)) : '' }; }
    else { const p = products.find(x=>x.id===v); if(!p) return; line = { id: ctUid(), productId: p.id, desc: p.name, qty:'1', price: String(Math.round(productSalePrice(p.name)||0)||''), cost:'' }; }
    if(c.lines.length===1 && !c.lines[0].desc && !c.lines[0].price) c.lines[0] = line; else c.lines.push(line);

  document.getElementById('ctPlanAdd')?.addEventListener('click', ()=>{ c.plan.push({ id: ctUid(), label:'', percent:'', trigger:'date', dueDate:'' }); render(); });
  document.querySelectorAll('.ctp-label').forEach(el=> el.addEventListener('input', e=>{ c.plan[+e.target.dataset.idx].label = e.target.value; }));
  document.querySelectorAll('.ctp-pct').forEach(el=> el.addEventListener('change', e=>{ c.plan[+e.target.dataset.idx].percent = num(e.target.value); render(); }));
  document.querySelectorAll('.ctp-trigger').forEach(el=> el.addEventListener('change', e=>{ c.plan[+e.target.dataset.idx].trigger = e.target.value; render(); }));
  document.querySelectorAll('.ctp-remove').forEach(el=> el.addEventListener('click', e=>{ c.plan.splice(+e.currentTarget.dataset.idx,1); render(); }));
  document.querySelectorAll('.ct-field').forEach(el=> el.addEventListener('input', e=>{ c.fieldValues = c.fieldValues || {}; c.fieldValues[e.target.dataset.key] = e.target.value; }));
  document.getElementById('ctSave')?.addEventListener('click', ()=>{ if(saveContractDraft()){ ctView='list'; ctDraft=null; ctEditingId=null; render(); } });
  document.getElementById('ctPreview')?.addEventListener('click', ()=> previewContract(c));
  document.getElementById('ctJpg')?.addEventListener('click', e=> exportContractJPG(c, e.currentTarget));
  document.getElementById('ctPrint')?.addEventListener('click', ()=> printContract(c));
  document.getElementById('ctToInvoice')?.addEventListener('click', ()=>{ if(!saveContractDraft()) return; contractToInvoice(contracts.find(x=>x.id===ctEditingId)); });

function qeChips(scope){
  if(scope==='invoice') return JOB_COST_KINDS.filter(k=>k[0]!=='depreciation').map(k=>({ key:k[0], label:k[1] }));
  const tag = scope==='personal' ? 'personal' : 'business';
  const cnt = {}; expenses.filter(e=>e.tag===tag).forEach(e=>{ cnt[e.categoryName] = (cnt[e.categoryName]||0)+1; });
  const hist = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const fixed = expenseCategories.filter(c=>c.tag===tag).map(c=>c.name);
  const seen = new Set(), out = [];
  [...hist.slice(0,8), ...fixed, ...(scope==='personal' ? QE_PERSONAL_DEFAULT : QE_BUSINESS_DEFAULT)].forEach(n=>{ if(n && !seen.has(n) && out.length<14){ seen.add(n); out.push({ key:n, label:n }); } });

function qeKey(e){

function showUndoToast(msg, undo){
  document.getElementById('qeToast')?.remove();
  const t = document.createElement('div'); t.id = 'qeToast'; t.className = 'qe-toast';
  t.innerHTML = `<span>${msg}</span>${undo ? '<button>لغو</button>' : ''}`;

function qeSave(){
  if(!qe) return;
  const amt = parseInt(qe.amt)||0; if(!amt) return;
  let undo, msg;
  if(qe.scope==='invoice'){
    const inv = invoices.find(i=>i.id===qe.invoiceId);
    if(!inv){ alert('یک فاکتور انتخاب کن'); return; }
    if(!Array.isArray(inv.jobCosts)) inv.jobCosts = [];
    const id = ctUid();
    inv.jobCosts.push({ id, kind: qe.kind||'other', title: [(qe.title||'').trim(), (qe.note||'').trim()].filter(Boolean).join(' — '), amount: String(amt), vendorId:'', paid:true });
    saveJSON(STORE_KEYS.invoices, invoices);
    qeState.last.invoice = qe.kind||'other';
    undo = ()=>{ inv.jobCosts = (inv.jobCosts||[]).filter(c=>c.id!==id); saveJSON(STORE_KEYS.invoices, invoices); };
    msg = `✓ ${fmt(amt)} ت به فاکتور #${invNumStr(inv.number)} اضافه شد`;
  } else {
    const title = (qe.title||'').trim();
    if(!title){ alert('یک دسته انتخاب کن یا عنوان بنویس'); return; }
    const tag = qe.scope==='personal' ? 'personal' : 'business';
    const cat = expenseCategories.find(c=>c.tag===tag && c.name===title);
    const id = Date.now().toString() + Math.random().toString(36).slice(2);
    expenses = [...expenses, { id, categoryId: cat ? cat.id : (qe.categoryId||null), categoryName: title, amount: amt, date: qe.date || todayStr(), note: (qe.note||'').trim(), tag, ...(qe.staffId ? { staffId: qe.staffId } : {}) }];
    saveJSON(STORE_KEYS.expenses, expenses);
    qeState.last[qe.scope] = title;
    undo = ()=>{ expenses = expenses.filter(e=>e.id!==id); saveJSON(STORE_KEYS.expenses, expenses); };
    msg = `✓ ${fmt(amt)} ت — ${escapeAttr(title)} (${qe.scope==='personal'?'شخصی':'جاری آتلیه'})`;
  }
  qeState.scope = qe.scope; qeSaveState();
  closeQuickExpense(); render(); showUndoToast(msg, undo);
}

      <label class="row-flex" style="align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="stActive" ${d.active!==false?'checked':''} style="width:auto"><span class="small">فعال (در آفیش‌ها و فاکتورها قابل انتخاب باشد)</span></label>
    </div>
    <button id="stSave" class="btn btn-red" style="width:100%;margin-top:10px">${staffEditingId?'ذخیره تغییرات':'ثبت فرد'}</button>`;
}
function renderStaffTab(){

    <button id="stNew" class="btn btn-red" style="width:100%;margin-bottom:10px">+ افزودن فرد</button>
    ${monthlyTotal>0 ? `<div class="card" style="margin-bottom:10px"><div class="card-title"><span>جمع حقوق ماهانه کارمندان فعال</span><span style="font-weight:800">${fmt(monthlyTotal)} ت</span></div></div>` : ''}
    <div class="mode-toggle" style="margin-bottom:10px">${pill('all','همه')}${pill('monthly','حقوق ماهانه')}${pill('project','پروژه‌ای')}</div>
    ${list.length===0 ? '<p class="empty">هنوز فردی ثبت نشده</p>' : list.map(s=>{
      const open = staffOpenId===s.id, linked = s.type==='project' ? staffLinkedJobCosts(s.id) : [];
      const owed = linked.filter(c=>!c.paid).reduce((a,c)=>a+(parseFloat(c.amount)||0),0);
      const paidList = s.type==='monthly' ? expenses.filter(e=>e.staffId===s.id).sort((a,b)=>b.date.localeCompare(a.date)) : [];
      return `<div class="card" data-row-id="${s.id}" style="margin-bottom:8px;${s.active===false?'opacity:.6':''}">
        <div class="card-title"><span>${escapeAttr(s.name)}${s.active===false?' <span class="small">(غیرفعال)</span>':''}</span><span class="badge-activity">${s.type==='monthly'?'حقوق ماهانه':'پروژه‌ای'}</span></div>
        <div class="card-sub">${(s.roles||[]).map(escapeAttr).join(' • ') || 'نقش تعیین نشده'}${s.phone? ' — '+escapeAttr(s.phone):''}</div>
        <div class="card-sub">${staffPayText(s)}</div>
        ${s.type==='monthly' ? `<div class="r-row" style="align-items:center;margin-top:4px"><span style="font-size:12.5px">${staffPaidThisMonth(s)?'✅ حقوق این ماه پرداخت شد':'⬜ حقوق این ماه پرداخت نشده'}</span>${staffPaidThisMonth(s)?'':`<button class="btn btn-outline st-pay" data-id="${s.id}" style="font-size:11.5px;padding:3px 10px;min-height:28px">ثبت پرداخت</button>`}</div>`
          : `<div class="card-sub" style="${owed>0?'color:var(--red);font-weight:700':''}">${linked.length ? 'کارکرد ثبت‌شده: '+toPersianDigits(linked.length)+' مورد' : 'کارکردی روی فاکتورها ثبت نشده'}${owed>0 ? ' — مانده طلب: '+fmt(owed)+' ت' : ''}</div>`}
        ${((s.roles||[]).includes('ادیتور') || editorLoad(s.id)>0) ? `<div class="r-row" style="align-items:center;margin-top:4px"><span style="font-size:12.5px;${editorLoad(s.id)>=editorMax(s)?'color:var(--red);font-weight:700':''}">${editorLoad(s.id)>=editorMax(s)?'⚠ ':''}ادیت: ${toPersianDigits(editorLoad(s.id))} از ${toPersianDigits(editorMax(s))} پروژه</span><button class="btn btn-outline st-load" data-id="${s.id}" style="font-size:11.5px;padding:3px 10px;min-height:28px">پروژه‌ها</button></div>` : ''}
        <div class="row-flex" style="margin-top:8px;gap:6px">
          <button class="btn btn-outline st-open" data-id="${s.id}" style="flex:1;font-size:12px">${open?'بستن ریز':'ریز'}</button>
          <button class="btn btn-outline st-edit" data-id="${s.id}" style="flex:1;font-size:12px">ویرایش</button>
          <button class="btn-icon st-del" data-id="${s.id}">×</button>
        </div>
        ${open ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #E5E5E5">
          ${s.type==='project' ? (linked.length ? linked.map(c=>`<div class="r-row" style="align-items:center;padding:3px 0;font-size:12.5px"><span>فاکتور #${invNumStr(c.invNumber)} ${escapeAttr(c.customer)} — ${jobKindLabel(c.kind)}<br><b>${fmt(c.amount)} ت</b></span><button class="btn ${c.paid?'btn-outline':'btn-black'} st-toggle-paid" data-inv="${c.invId}" data-id="${c.id}" style="font-size:11px;padding:3px 8px;min-height:28px">${c.paid?'پرداخت شد ✓':'ثبت پرداخت'}</button></div>`).join('') : '<p class="note" style="margin:0">در فاکتور، بخش «هزینه‌های اجرا» این فرد را انتخاب کن تا اینجا بیاید.</p>')
          : (paidList.length ? paidList.map(e=>`<div class="r-row" style="padding:3px 0;font-size:12.5px"><span>${jalaliStr(e.date)}</span><span>${fmt(e.amount)} ت</span></div>`).join('') : '<p class="note" style="margin:0">هنوز پرداختی ثبت نشده.</p>')}
        </div>` : ''}
      </div>`;

function bindStaffEvents(){
  document.getElementById('stNew')?.addEventListener('click', ()=>{ staffDraft = blankStaff(); staffEditingId = null; staffView = 'form'; render(); });
  document.querySelectorAll('.st-filter').forEach(el=> el.addEventListener('click', e=>{ staffFilter = e.currentTarget.dataset.f; render(); }));
  document.querySelectorAll('.st-open').forEach(el=> el.addEventListener('click', e=>{ const id = e.currentTarget.dataset.id; staffOpenId = staffOpenId===id ? null : id; render(); }));
  document.querySelectorAll('.st-edit').forEach(el=> el.addEventListener('click', e=>{ const x = staff.find(q=>q.id===e.currentTarget.dataset.id); if(x){ staffDraft = JSON.parse(JSON.stringify(x)); staffEditingId = x.id; staffView = 'form'; render(); } }));
  document.querySelectorAll('.st-load').forEach(el=> el.addEventListener('click', e=>{ editFilter = e.currentTarget.dataset.id; navBackStack.push('staff'); tab = 'editing'; render(); }));
  document.querySelectorAll('.st-pay').forEach(el=> el.addEventListener('click', e=>{ const x = staff.find(q=>q.id===e.currentTarget.dataset.id); if(x) openQuickExpense({ scope:'business', title:'حقوق ' + x.name, amount: ctNum(x.salary), staffId: x.id }); }));
  document.querySelectorAll('.st-toggle-paid').forEach(el=> el.addEventListener('click', e=>{
    const inv = invoices.find(i=>i.id===e.currentTarget.dataset.inv); const c = inv && (inv.jobCosts||[]).find(x=>x.id===e.currentTarget.dataset.id);
    if(!c) return; c.paid = !c.paid; saveJSON(STORE_KEYS.invoices, invoices); render();
  }));
  document.querySelectorAll('.st-del').forEach(el=> el.addEventListener('click', e=>{
    const id = e.currentTarget.dataset.id;
    const used = staffLinkedJobCosts(id).length || expenses.some(x=>x.staffId===id) || invoices.some(i=>(i.jobCosts||[]).some(c=>c.staffId===id)) || bookings.some(b=>(b.resourceIds||[]).includes(id));
    if(used){ if(!confirm('این فرد در فاکتورها، آفیش‌ها یا پرداخت‌ها استفاده شده و حذفش تاریخچه را خراب می‌کند. به‌جای حذف «غیرفعال» شود؟')) return; const x = staff.find(q=>q.id===id); if(x) x.active = false; }
    else { if(!confirm('این فرد حذف شود؟')) return; staff = staff.filter(q=>q.id!==id); }
    saveJSON(STORE_KEYS.staff, staff); syncResources(); render();
  }));
  if(staffView!=='form' || !staffDraft) return;
  const d = staffDraft;
  document.getElementById('stBack')?.addEventListener('click', ()=>{ staffView='list'; staffDraft=null; staffEditingId=null; render(); });
  document.getElementById('stName')?.addEventListener('input', e=>{ d.name = e.target.value; });
  document.getElementById('stPhone')?.addEventListener('input', e=>{ d.phone = e.target.value; });
  document.getElementById('stNote')?.addEventListener('input', e=>{ d.note = e.target.value; });
  document.getElementById('stMaxLoad')?.addEventListener('input', e=>{ d.maxLoad = toLatinDigits(e.target.value).replace(/[^0-9]/g,'').slice(0,2); });
  document.getElementById('stActive')?.addEventListener('change', e=>{ d.active = e.target.checked; });
  document.querySelectorAll('.st-role').forEach(el=> el.addEventListener('click', e=>{ const r = e.currentTarget.dataset.r; const set = new Set(d.roles||[]); set.has(r) ? set.delete(r) : set.add(r); d.roles = [...set]; render(); }));
  document.getElementById('stType')?.addEventListener('change', e=>{ d.type = e.target.value; render(); });
  document.getElementById('stPayType')?.addEventListener('change', e=>{ d.payType = e.target.value; render(); });
  document.getElementById('stRate')?.addEventListener('input', e=>{ d.rate = toLatinDigits(e.target.value); });
  document.getElementById('stSalary')?.addEventListener('input', e=>{ d.salary = toLatinDigits(e.target.value); });
  document.getElementById('stPayDay')?.addEventListener('input', e=>{ d.payDay = toLatinDigits(e.target.value).replace(/[^0-9]/g,'').slice(0,2); });
  document.getElementById('stSave')?.addEventListener('click', ()=>{
    if(!d.name.trim()){ alert('نام را وارد کن'); return; }
    if(d.type==='monthly' && !(ctNum(d.salary)>0)){ if(!confirm('حقوق ماهانه وارد نشده. بدون حقوق ثبت شود؟')) return; }
    d.name = d.name.trim();
    if(staffEditingId){ const i = staff.findIndex(x=>x.id===staffEditingId); if(i>=0) staff[i] = { ...d, id: staffEditingId }; } else staff.push({ ...d });
    saveJSON(STORE_KEYS.staff, staff); syncResources();
    staffView = 'list'; staffDraft = null; staffEditingId = null; render();
  });
}

/* ===== تعرفه قیمت‌ها (هر ساعت / هر شات / ...) ===== */
let tfDraft = { name:'', unit:'hour', price:'', cost:'', note:'' }, tfEditingId = null;

      ${tfEditingId ? '<button id="tfCancel" class="btn btn-outline" style="width:100%;margin-top:6px">انصراف از ویرایش</button>' : ''}
    </div>
    ${tariff.length===0 ? '<p class="empty">تعرفه‌ای ثبت نشده</p>' : tariff.map(t=>{

      return `<div class="card" data-row-id="${t.id}" style="margin-bottom:8px">
        <div class="card-title"><span>${escapeAttr(t.name)}</span><span style="font-weight:800">${fmt(p)} ت</span></div>
        <div class="card-sub">هر ${TARIFF_UNITS[t.unit]||''}${t.note? ' — '+escapeAttr(t.note):''}${c>0 ? ' — هزینه: '+fmt(c)+' ت (سود هر واحد: '+fmt(p-c)+' ت)' : ''}</div>
        <div class="row-flex" style="gap:8px;margin-top:6px"><button class="btn btn-outline tf-edit" data-id="${t.id}" style="font-size:12px;padding:4px 10px">ویرایش</button><button class="btn btn-outline tf-del" data-id="${t.id}" style="font-size:12px;padding:4px 10px;color:var(--red)">حذف</button></div>
      </div>`; }).join('')}`;

function bindTariffEvents(){
  const f = tfDraft;
  document.getElementById('tfName')?.addEventListener('input', e=>{ f.name = e.target.value; });

  document.getElementById('tfPrice')?.addEventListener('input', e=>{ f.price = toLatinDigits(e.target.value); });

}


/* ===== ادیتور هر پروژه + پیگیری ===== */
const EDIT_ACTIVE = ['shot','selection','editing','albumdesign','approval'];
let editFilter = 'all';
function editProjects(){ return invoices.filter(i=> (i.status==='final' || i.status==='paid') && EDIT_ACTIVE.includes(i.projectStatus)); }
function editorLoad(id){ return editProjects().filter(i=>i.editorId===id).length; }
function editorMax(st){ const m = parseInt(st.maxLoad); return m>0 ? m : 3; }
function staffName(id){ const st = staff.find(x=>x.id===id); return st ? st.name : '؟'; }
function editorOptionsHTML(selectedId){
  const list = staff.filter(x=>x.active!==false || x.id===selectedId).sort((a,b)=> ((b.roles||[]).includes('ادیتور')) - ((a.roles||[]).includes('ادیتور')) || a.name.localeCompare(b.name,'fa'));
  return `<option value="">— ادیتور تعیین نشده —</option>` + list.map(x=>{ const n = editorLoad(x.id), over = n >= editorMax(x); return `<option value="${x.id}" ${selectedId===x.id?'selected':''}>${over?'⚠ ':''}${escapeAttr(x.name)}${(x.roles||[]).includes('ادیتور')?'':' ('+escapeAttr((x.roles||['—'])[0]||'—')+')'} — ${toPersianDigits(n)} پروژه در دست</option>`; }).join('');
}
// تغییر ادیتور روی یک فاکتور (چه پیش‌نویس داخل فرم، چه فاکتور ذخیره‌شده در تابلوی پیگیری) با ثبت تاریخچه
function applyEditorChange(inv, newId, reason){
  const old = inv.editorId || '';
  if(old === newId) return false;
  if(!Array.isArray(inv.editorHistory)) inv.editorHistory = [];
  inv.editorHistory.push({ id: ctUid(), date: todayStr(), from: old, to: newId, reason: (reason||'').trim() });
  inv.editorId = newId;
  const costs = old ? (inv.jobCosts||[]).filter(c=> c.staffId===old && c.kind==='editing' && !c.paid) : [];
  if(newId && costs.length && confirm('هزینه ادیت ثبت‌شده برای «' + staffName(old) + '» (' + toPersianDigits(costs.length) + ' مورد پرداخت‌نشده) به «' + staffName(newId) + '» منتقل شود؟\n(مبلغ تغییر نمی‌کند؛ اگر نرخ او فرق دارد در فاکتور اصلاح کن.)')){
    costs.forEach(c=>{ if(c.title===staffName(old)) c.title = staffName(newId); c.staffId = newId; });
  }
  return true;
}
function askEditorChange(inv, newId){
  const old = inv.editorId || '';
  let reason = '';
  if(old){ reason = prompt('دلیل تغییر ادیتور (اختیاری — مثلا مرخصی، شلوغی، کیفیت):', ''); if(reason===null) return false; }
  return applyEditorChange(inv, newId, reason);
}
function editorHistoryHTML(inv){
  const h = (inv.editorHistory||[]).slice().reverse();
  if(!h.length) return '';
  return `<div style="margin-top:6px;font-size:11.5px;color:#6B7075;line-height:1.9">${h.slice(0,4).map(x=>`• ${jalaliStr(x.date)}: ${x.from? escapeAttr(staffName(x.from)) : 'بدون ادیتور'} ← ${x.to? escapeAttr(staffName(x.to)) : 'بدون ادیتور'}${x.reason? ' — '+escapeAttr(x.reason):''}`).join('<br>')}</div>`;
}
function editSummary(){
  const list = editProjects(), t = todayStr();
  return { total:list.length, noEditor:list.filter(i=>!i.editorId).length, overdue:list.filter(i=>i.editDue && i.editDue < t).length };
}
function renderEditingTab(){
  const t = todayStr(), sm = editSummary();
  let list = editProjects();
  if(editFilter==='none') list = list.filter(i=>!i.editorId);
  else if(editFilter!=='all') list = list.filter(i=>i.editorId===editFilter);
  list.sort((a,b)=>{ const ao = a.editDue && a.editDue<t ? 0 : 1, bo = b.editDue && b.editDue<t ? 0 : 1; return ao-bo || (a.editDue||'9999').localeCompare(b.editDue||'9999') || (b.number||0)-(a.number||0); });
  const editors = staff.filter(x=> x.active!==false && ((x.roles||[]).includes('ادیتور') || editorLoad(x.id)>0));
  return `
    <div class="grid2" style="margin-bottom:10px">
      <div class="card"><div class="card-sub">پروژه‌های در دست ادیت</div><div class="dash-stat-num">${toPersianDigits(sm.total)}</div></div>
      <div class="card" style="${sm.noEditor||sm.overdue?'border-color:var(--red)':''}"><div class="card-sub">بدون ادیتور / از موعد گذشته</div><div class="dash-stat-num" style="color:${sm.noEditor||sm.overdue?'var(--red)':'inherit'}">${toPersianDigits(sm.noEditor)} / ${toPersianDigits(sm.overdue)}</div></div>
    </div>
    ${editors.length ? `<div class="card" style="margin-bottom:10px"><div class="card-title"><span>بار کاری ادیتورها</span></div>${editors.map(x=>{ const n = editorLoad(x.id), m = editorMax(x), over = n>=m; return `<div class="r-row" style="align-items:center;padding:3px 0"><span style="font-size:12.5px;${over?'color:var(--red);font-weight:700':''}">${over?'⚠ ':''}${escapeAttr(x.name)}</span><span style="font-size:12.5px">${toPersianDigits(n)} از ${toPersianDigits(m)} پروژه</span></div>`; }).join('')}<p class="note" style="margin:6px 0 0;text-align:right">«حداکثر پروژه هم‌زمان» هر ادیتور را در فرم کارکنان تنظیم می‌کنی.</p></div>` : ''}
    <select id="editFilter" style="margin-bottom:10px"><option value="all" ${editFilter==='all'?'selected':''}>همه‌ی پروژه‌ها</option><option value="none" ${editFilter==='none'?'selected':''}>فقط بدون ادیتور</option>${staff.filter(x=>editorLoad(x.id)>0 || (x.roles||[]).includes('ادیتور')).map(x=>`<option value="${x.id}" ${editFilter===x.id?'selected':''}>ادیتور: ${escapeAttr(x.name)}</option>`).join('')}</select>
    ${list.length===0 ? '<p class="empty">پروژه‌ای در این بخش نیست</p>' : list.map(i=>{
      const late = i.editDue && i.editDue < t;
      return `<div class="card" data-row-id="${i.id}" style="margin-bottom:8px;${late||!i.editorId?'border-color:var(--red)':''}">
        <div class="card-title"><span>#${invNumStr(i.number)} — ${escapeAttr(i.customerName||'بدون نام')}</span><span style="font-size:11px;font-weight:700;color:${late?'var(--red)':'#6B7075'}">${late?'⚠ از موعد گذشته':(i.editDue?'موعد '+jalaliStr(i.editDue):'')}</span></div>

/* ===== نوع واریزی و برنامه پرداخت (اقساط) ===== */
const PAY_KINDS = { deposit:'بیعانه', installment:'قسط (حین کار)', final:'تسویه نهایی', extra:'فریم / سفارش اضافه' };
const PLAN_TRIGGERS = { booking:'هنگام ثبت سفارش', after_shoot:'بعد از برگزاری آفیش', delivery:'هنگام تحویل فایل / آلبوم', date:'تاریخ مشخص' };
const PLAN_TEMPLATES = {
  '30-40-30': [['بیعانه',30,'booking'],['بعد از آفیش',40,'after_shoot'],['هنگام تحویل',30,'delivery']],
  '50-50': [['بیعانه',50,'booking'],['هنگام تحویل',50,'delivery']],
  '100': [['پرداخت کامل هنگام ثبت',100,'booking']],
};
function planKindFor(idx, total){ return idx===0 ? 'deposit' : (idx===total-1 && total>1 ? 'final' : 'installment'); }
function loadPlanTemplate(key){
  invDraft.paymentPlan = (PLAN_TEMPLATES[key]||[]).map(r=>({ id: Date.now().toString()+Math.random().toString(36).slice(2,6), label:r[0], percent:String(r[1]), trigger:r[2], dueDate:'' }));
}
// مبلغ هر قسط از روی «مبلغ قابل پرداخت» (با مالیات)؛ آخرین قسط باقی‌مانده/گرد‌کردن را می‌گیرد اگر جمع درصدها ۱۰۰ باشد
function planAmounts(inv, t){
  const plan = inv.paymentPlan||[];
  const sum = plan.reduce((a,r)=>a+(parseFloat(r.percent)||0),0);
  let used = 0;
  return plan.map((r,i)=>{
    let amt = Math.round(t.grandTotal*(parseFloat(r.percent)||0)/100);
    if(i===plan.length-1 && Math.abs(sum-100)<0.001) amt = Math.max(0, t.grandTotal - used);
    used += amt; return amt;
  });
}
// پرداخت‌ها به ترتیب روی قسط‌ها تخصیص داده می‌شود
function planStatus(inv){
  const t = computeInvoiceTotals(inv);
  const amounts = planAmounts(inv, t);
  let left = t.paid;
  return (inv.paymentPlan||[]).map((r,i)=>{
    const amount = amounts[i];
    const covered = Math.min(amount, Math.max(0, left)); left -= covered;
    return { row:r, amount, covered, remaining: amount-covered, state: covered>=amount && amount>0 ? 'paid' : (covered>0 ? 'partial' : 'unpaid') };
  });
}
function planRowIsDue(inv, r){
  const order = Object.keys(PROJECT_STATUS_LABELS);
  const idx = order.indexOf(inv.projectStatus);
  if(r.trigger==='booking') return true;
  if(r.trigger==='after_shoot') return idx >= order.indexOf('shot') || bookings.some(b=>b.invoiceId===inv.id && b.status==='done');
  if(r.trigger==='delivery') return idx >= order.indexOf('ready');
  if(r.trigger==='date') return !!r.dueDate && r.dueDate<=todayStr();
  return false;
}

function bindInvoiceListEvents(){
  bindBankInfoEvents();
  document.getElementById('newInvBtn')?.addEventListener('click', ()=>{ newInvoiceFromDraft(); render(); });
  const searchEl = document.getElementById('invSearchInput');
  if(searchEl){
    searchEl.addEventListener('input', e=>{
      const val = e.target.value;
      const pos = e.target.selectionStart;
      clearTimeout(invSearchDebounceTimer);
      invSearchDebounceTimer = setTimeout(()=>{
        invSearchQuery = val;
        invListVisibleCount = 30; // با تغییر جستجو، لیست از اول (۳۰ تای اول نتیجه‌ی جدید) نشون داده بشه
        render();
        const again = document.getElementById('invSearchInput');
        if(again){ again.focus(); again.setSelectionRange(pos,pos); }
      }, 150);
    });
  }
  document.getElementById('invLoadMoreBtn')?.addEventListener('click', ()=>{
    invListVisibleCount += 30;
    render();
  });
  document.getElementById('invClearQuickFilterBtn')?.addEventListener('click', ()=>{
    invQuickFilter = null;
    invListVisibleCount = 30;
    render();
  });
  document.querySelectorAll('.inv-edit').forEach(el=>{
    el.addEventListener('click', e=>{ loadInvoiceForEdit(e.currentTarget.dataset.id); render(); });
  });
  document.querySelectorAll('.inv-duplicate').forEach(el=>{
    el.addEventListener('click', e=>{ duplicateInvoice(e.currentTarget.dataset.id); render(); });
  });
  document.querySelectorAll('.inv-quick-settle').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const inv = invoices.find(i=>i.id===id);
      if(!inv) return;
      const t = computeInvoiceTotals(inv);
      if(t.balance<=0) return;
      if(!confirm('ثبت پرداخت کامل به مبلغ ' + fmt(t.balance) + ' تومان برای این فاکتور؟')) return;
      const payments = Array.isArray(inv.payments) ? [...inv.payments] : [];
      payments.push({ id:'quick-'+Date.now(), date: todayStr(), amount: t.balance, note:'ثبت سریع - پرداخت کامل' });
      const updated = {...inv, payments};
      updated.status = resolveInvoiceStatus(updated, updated.status);
      invoices = invoices.map(i=> i.id===id? updated : i);
      saveJSON(STORE_KEYS.invoices, invoices);
      render();
    });
  });
  document.querySelectorAll('.inv-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      if(!confirm('این فاکتور حذف شود؟')) return;
      const id = e.currentTarget.dataset.id;
      const rowEl = e.currentTarget.closest('[data-row-id]');
      animateAndRemoveRow(rowEl, ()=>deleteInvoice(id));
    });
  });
  document.querySelectorAll('.inv-status[data-act="cycle"]').forEach(el=>{
    el.addEventListener('click', e=>{ cycleInvoiceStatusInList(e.currentTarget.dataset.id); });
  });
  document.querySelectorAll('.inv-jpg').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) exportInvoiceJPG(inv, e.currentTarget);
    });
  });
  document.querySelectorAll('.inv-share').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) shareInvoiceJPG(inv, e.currentTarget);
    });
  });
  document.querySelectorAll('.inv-preview').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) previewInvoice(inv);
    });
  });
  document.querySelectorAll('.inv-print').forEach(el=>{
    el.addEventListener('click', e=>{
      const inv = invoices.find(i=>i.id===e.currentTarget.dataset.id);
      if(inv) printInvoice(inv);
    });
  });
}

    el.addEventListener('input', e=>{ invDraft.lines[+e.target.dataset.idx].customCost = e.target.value; rerenderInvoiceEdit(); });
  });
  document.querySelectorAll('.invline-linediscount').forEach(el=>{
    el.addEventListener('input', e=>{ invDraft.lines[+e.target.dataset.idx].lineDiscount = e.target.value; rerenderInvoiceEdit(); });

  document.querySelectorAll('.invline-remove').forEach(el=>{
    el.addEventListener('click', e=>{
      const idx = +e.currentTarget.dataset.idx;
      const rowEl = e.currentTarget.closest('[data-line]');

        invDraft.lines.splice(idx,1);

// رندر سریع فقط بخش‌های قابل‌تغییر بدون رفرش کل تب (برای حفظ فوکوس روی اینپوت)
function rerenderInvoiceEdit(){
  // فقط جمع هر ردیف و جمع کل را آپدیت می‌کنیم، بدون بازسازی DOM ردیف‌ها (تا فوکوس و کیبورد از دست نرود)
  invDraft.lines.forEach((l,i)=>{

/* ===== موتور صفحه‌بندی A4 =====
   فاکتور یا قرارداد ابتدا به صورت یک جریان بلند ساخته می‌شود؛ اینجا اندازه‌ی هر بخش اندازه‌گیری و در برگه‌های دقیقاً A4 چیده می‌شود:
   سربرگ فقط در صفحه‌ی اول، جدول با سرستون تکراری، پاورقی و شماره‌ی صفحه در همه‌ی صفحه‌ها، و هیچ برگه‌ای فقط با یک خط ساخته نمی‌شود. */
const A4_H = 1123;
async function paginateA4(rawHTML){
  try{ if(document.fonts){ await document.fonts.load('12px Vazirmatn'); await document.fonts.ready; } }catch(e){}
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none;';
  host.innerHTML = rawHTML;
  document.body.appendChild(host);
  try{
    const wrap = host.querySelector('.a4-wrap');
    const page = wrap.querySelector('.a4-page');
    const kids = Array.from(page.children);
    const footer = kids.find(k=>k.classList.contains('a4-footer'));
    const table = kids.find(k=>k.tagName==='TABLE');
    const tailBox = kids.find(k=>k.classList.contains('a4-bottom-grid'));
    const topKids = kids.filter(k=>k!==footer && k!==table && k!==tailBox);
    const tailKids = tailBox ? Array.from(tailBox.children) : [];
    const thead = table ? table.querySelector('thead') : null;
    const rowEls = table ? Array.from(table.querySelectorAll('tbody tr')) : [];
    const contText = page.getAttribute('data-cont') || '';
    const oh = el=>{ const r = el.getBoundingClientRect(), cs = getComputedStyle(el); return r.height + (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0); };

    const layout = ()=>{
      const probe = document.createElement('div'); probe.className = 'a4-cont-header'; probe.innerHTML = '<span>x</span><span>y</span>';
      page.insertBefore(probe, page.firstChild); const contH = oh(probe); probe.remove();
      const cs = getComputedStyle(page);
      const padV = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
      const cap = A4_H - padV - (footer ? oh(footer) : 0) - 14;
      const topH = topKids.reduce((a,k)=>a+oh(k), 0);
      const theadH = thead ? thead.getBoundingClientRect().height : 0;
      const rowH = rowEls.map(r=>r.getBoundingClientRect().height);
      // واحدهای پایانی: بخش‌هایی که با علامت data-keep به قبل/بعد می‌چسبند، با هم جابه‌جا می‌شوند
      const units = [];
      tailKids.forEach(el=>{
        const keep = el.getAttribute('data-keep');
        const h = oh(el);
        if(keep==='prev' && units.length){ const u = units[units.length-1]; u.els.push(el); u.h += 12 + h; }
        else if(units.length && units[units.length-1].open){ const u = units[units.length-1]; u.els.push(el); u.h += 12 + h; u.open = (keep==='next'); }
        else units.push({ els:[el], h, open: keep==='next' });
      });
      const pages = []; let cur = { top: topKids.slice(), rows: [], tail: [] }, used = topH;
      const newPage = ()=>{ pages.push(cur); cur = { top: null, rows: [], tail: [] }; used = contH; };
      for(let i=0;i<rowEls.length;i++){
        const h = rowH[i];
        const need = (cur.rows.length===0 ? theadH + 4 : 0) + h;
        const fresh = (cur.top===null && cur.rows.length===0 && used===contH);
        if(used + need > cap && !fresh){
          let carry = [];
          if(i===rowEls.length-1 && cur.rows.length>=3){ carry = [cur.rows.pop()]; used -= rowH[rowEls.indexOf(carry[0])]; }
          newPage();
          carry.forEach(r=>{ used += (cur.rows.length===0 ? theadH + 4 : 0) + rowH[rowEls.indexOf(r)]; cur.rows.push(r); });
        }
        used += (cur.rows.length===0 ? theadH + 4 : 0) + h;
        cur.rows.push(rowEls[i]);
      }
      units.forEach(u=>{
        const fresh = (cur.top===null && cur.rows.length===0 && cur.tail.length===0);
        if(used + u.h + 12 > cap && !fresh) newPage();
        u.els.forEach(el=>cur.tail.push(el));
        used += u.h + 12;
      });
      pages.push(cur);
      return pages;
    };

    let pages = layout();
    if(pages.length > 1){               // اگر کمی بیشتر از یک صفحه بود، اول با فاصله‌های فشرده‌تر امتحان می‌کنیم
      wrap.classList.add('a4-compact');
      const p2 = layout();
      if(p2.length === 1) pages = p2; else wrap.classList.remove('a4-compact');
    }
    const vars = wrap.getAttribute('style') || '';
    const cls = Array.from(wrap.classList).filter(c=>c!=='a4-wrap').join(' ');
    const n = pages.length;
    const theadHTML = thead ? thead.outerHTML : '';
    const footHTML = i=>{
      if(!footer) return '';
      const ch = footer.children;
      const mid = n>1 ? `<div class="a4-page-no">صفحه ${toPersianDigits(i+1)} از ${toPersianDigits(n)}</div>` : '';
      return `<div class="a4-footer">${ch[0]?ch[0].outerHTML:''}${mid}${ch[1]?ch[1].outerHTML:''}</div>`;
    };
    const sheets = pages.map((p,i)=>`<div class="a4-sheet ${cls}" style="${vars}"><div class="a4-page">`
      + (i===0 ? p.top.map(k=>k.outerHTML).join('') : `<div class="a4-cont-header"><span>${escapeAttr(contText)}</span><span>ادامه — صفحه ${toPersianDigits(i+1)}</span></div>`)
      + (p.rows.length ? `<table class="a4-table">${theadHTML}<tbody>${p.rows.map(r=>r.outerHTML).join('')}</tbody></table>` : '')
      + (p.tail.length ? `<div class="a4-bottom-grid">${p.tail.map(k=>k.outerHTML).join('')}</div>` : '')
      + footHTML(i) + `</div></div>`);
    return { html: sheets.join(''), sheets, count: n };
  } finally { host.remove(); }
}
async function buildInvoiceSheets(inv){ return paginateA4(buildA4InvoiceHTML(inv)); }
function canvasToBlob(canvas){ return new Promise(res=> canvas.toBlob(b=>res(b), 'image/jpeg', 0.97)); }
async function renderSheetCanvases(sheetsHTML){
  const root = document.createElement('div');
  root.style.cssText = 'position:fixed;left:-9999px;top:0;';
  root.innerHTML = sheetsHTML;
  document.body.appendChild(root);
  try{
    const out = [];
    for(const sh of Array.from(root.querySelectorAll('.a4-sheet'))){
      out.push(await html2canvas(sh, {scale:3, useCORS:true, allowTaint:true, backgroundColor:'#ffffff', logging:false}));
    }
    return out;
  } finally { root.remove(); }
}
async function saveCanvasesJPG(canvases, baseName){
  for(let i=0;i<canvases.length;i++){
    const blob = await canvasToBlob(canvases[i]);
    if(!blob) throw new Error('blob');
    await saveBlobSmart(blob, canvases.length>1 ? `${baseName}-صفحه${i+1}.jpg` : `${baseName}.jpg`);
  }
}
async function shareCanvasesJPG(canvases, baseName, title){
  const files = [];
  for(let i=0;i<canvases.length;i++){
    const blob = await canvasToBlob(canvases[i]);
    if(!blob) throw new Error('blob');
    files.push(new File([blob], canvases.length>1 ? `${baseName}-صفحه${i+1}.jpg` : `${baseName}.jpg`, {type:'image/jpeg'}));
  }
  const data = { files, title };
  if(navigator.canShare && navigator.canShare(data)){ await navigator.share(data); return true; }
  return false;
}

// پیش‌نمایش صفحه‌به‌صفحه (مقیاس‌شده برای عرض گوشی) — برای دیدن شکل نهایی قبل از چاپ یا گرفتن عکس
function showA4Preview(sheets, title, onPrint, onJpg){
  document.getElementById('a4PreviewOv')?.remove();
  const ov = document.createElement('div');
  ov.id = 'a4PreviewOv';
  ov.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:9000;background:#D5D8DC;overflow:auto;-webkit-overflow-scrolling:touch;';
  const w = Math.min(window.innerWidth - 16, 794), sc = w / 794;
  ov.innerHTML = `<div style="position:sticky;top:0;z-index:2;background:#2F3338;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px">
      <button id="a4pvClose" class="btn" style="background:#fff;color:#2F3338;padding:6px 12px;font-size:12px;min-height:34px">✕ بستن</button>

      ${onJpg ? '<button id="a4pvJpg" class="btn" style="background:#fff;color:#2F3338;padding:6px 10px;font-size:12px;min-height:34px">JPG</button>' : ''}
      ${onPrint ? '<button id="a4pvPrint" class="btn btn-red" style="padding:6px 12px;font-size:12px;min-height:34px">چاپ</button>' : ''}
    </div>
    <div style="padding:12px 8px 60px;display:flex;flex-direction:column;align-items:center;gap:14px">
      ${sheets.map(h=>`<div style="width:${w}px;height:${Math.round(1123*sc)}px;position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25);background:#fff"><div style="position:absolute;top:0;left:0;width:794px;height:1123px;transform:scale(${sc});transform-origin:top left">${h}</div></div>`).join('')}
    </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#a4pvClose').addEventListener('click', ()=>ov.remove());
  ov.querySelector('#a4pvPrint')?.addEventListener('click', onPrint);
  ov.querySelector('#a4pvJpg')?.addEventListener('click', onJpg);
}
function invoiceFileBase(inv){
  const cust = (inv.customerName||'بدون نام').trim().replace(/[\\/:*?"<>|]/g,'-');
  return (brandInfo.name||'Studio').replace(/\s+/g,'_') + '-' + cust + '-' + inv.number;
}
function invoiceJpgFilename(inv){ return invoiceFileBase(inv) + '.jpg'; }
let invoiceExportInFlight = new Set();
function runInvoiceOutput(inv, triggerBtn, work){
  if(invoiceExportInFlight.has(inv.id)) return;
  invoiceExportInFlight.add(inv.id);
  if(triggerBtn){ triggerBtn.disabled = true; triggerBtn.style.opacity = '0.6'; }
  const cleanup = ()=>{ invoiceExportInFlight.delete(inv.id); if(triggerBtn){ triggerBtn.disabled = false; triggerBtn.style.opacity = ''; } };
  return Promise.resolve().then(work).then(cleanup, err=>{ cleanup(); throw err; });
}
function exportInvoiceJPG(inv, triggerBtn){
  runInvoiceOutput(inv, triggerBtn, async ()=>{
    const r = await buildInvoiceSheets(inv);
    const canvases = await renderSheetCanvases(r.html);
    await saveCanvasesJPG(canvases, invoiceFileBase(inv));
  }).catch(()=>{ alert('گرفتن خروجی عکس فاکتور با خطا مواجه شد، دوباره تلاش کن'); });
}
// اشتراک‌گذاری از طریق منوی «اشتراک‌گذاری» خودِ گوشی/سیستم‌عامل (واتساپ، تلگرام، ایمیل و...)؛ فاکتور چندصفحه‌ای چند عکس می‌شود
function shareInvoiceJPG(inv, triggerBtn){
  runInvoiceOutput(inv, triggerBtn, async ()=>{
    const r = await buildInvoiceSheets(inv);
    const canvases = await renderSheetCanvases(r.html);
    const ok = await shareCanvasesJPG(canvases, invoiceFileBase(inv), 'فاکتور #' + invNumStr(inv.number));
    if(!ok) alert('این مرورگر از اشتراک‌گذاری مستقیم پشتیبانی نمی‌کنه. از دکمه‌ی «خروجی JPG» استفاده کن و خودت از توی گالری با هر برنامه‌ای که خواستی بفرست.');
  }).catch(err=>{
    if(err && err.name==='AbortError') return; // کاربر خودش از منوی اشتراک‌گذاری انصراف داده
    alert('اشتراک‌گذاری انجام نشد، می‌تونی از دکمه‌ی «خروجی JPG» به‌جاش استفاده کنی');
  });
}
function printInvoice(inv){
  const w = openPrintWindow(); if(!w) return;           // پنجره همزمان با کلیک باز می‌شود تا مرورگر مسدودش نکند
  buildInvoiceSheets(inv).then(r=> writePrintDoc(w, r.html, 'فاکتور #' + invNumStr(inv.number)))
    .catch(()=>{ try{ w.close(); }catch(e){} alert('آماده‌سازی چاپ با خطا مواجه شد، دوباره تلاش کن'); });
}
function previewInvoice(inv){
  buildInvoiceSheets(inv).then(r=> showA4Preview(r.sheets, 'فاکتور #' + invNumStr(inv.number), ()=>printInvoice(inv), ()=>exportInvoiceJPG(inv, null)))
    .catch(()=>alert('ساخت پیش‌نمایش با خطا مواجه شد'));
}

function bindMaterialsEvents(){
  document.getElementById('matSubmitBtn')?.addEventListener('click', ()=>{
    const name = document.getElementById('matName').value.trim();
    const unit = document.getElementById('matUnit').value;
    const price = parseFloat(document.getElementById('matPrice').value);
    const stockQty = document.getElementById('matStockQty').value;
    const lowStockThreshold = document.getElementById('matLowStock').value;
    if(!name || isNaN(price) || price<0) return;
    if(editingMatId){
      materials = materials.map(m=> m.id===editingMatId? {...m,name,unit,price,stockQty,lowStockThreshold}: m);
      editingMatId=null;
    } else {
      materials.push({id:Date.now().toString(), name, unit, price, stockQty: stockQty||'0', lowStockThreshold});
    }
    saveJSON(STORE_KEYS.materials, materials);
    newMat = {name:'', unit:UNITS[0], price:'', stockQty:'', lowStockThreshold:''};
    render();
  });
  document.getElementById('matCancelBtn')?.addEventListener('click', ()=>{
    editingMatId=null; newMat={name:'',unit:UNITS[0],price:'',stockQty:'',lowStockThreshold:''}; render();
  });
  document.querySelectorAll('.mat-edit').forEach(el=>{
    el.addEventListener('click', e=>{
      const m = materials.find(x=>x.id===e.currentTarget.dataset.id);
      editingMatId = m.id;
      newMat = {name:m.name, unit:m.unit, price:String(m.price), stockQty:String(m.stockQty||''), lowStockThreshold:String(m.lowStockThreshold||'')};
      render();
    });
  });
  document.querySelectorAll('.mat-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const rowEl = e.currentTarget.closest('[data-row-id]');
      animateAndRemoveRow(rowEl, ()=>{
        materials = materials.filter(m=>m.id!==id);
        calc.items = calc.items.filter(it=>it.materialId!==id);
        saveJSON(STORE_KEYS.materials, materials);
        render();
      });
    });
  });
  document.querySelectorAll('.mat-stock-adjust-input').forEach(el=>{
    el.addEventListener('input', e=>{ matStockAdjustDraft[e.target.dataset.id] = e.target.value; });
  });
  // افزودن/کسر سریع موجودی — بدون نیاز به باز کردن فرم ویرایش کامل؛ برای زمانی که مواد خریداری یا مصرف می‌شه
  document.querySelectorAll('.mat-stock-add').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const amount = parseFloat(matStockAdjustDraft[id]);
      if(isNaN(amount) || amount<=0) return;
      materials = materials.map(m=> m.id===id? {...m, stockQty: String((parseFloat(m.stockQty)||0) + amount)} : m);
      delete matStockAdjustDraft[id];
      saveJSON(STORE_KEYS.materials, materials);
      render();
    });
  });
  document.querySelectorAll('.mat-stock-sub').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const amount = parseFloat(matStockAdjustDraft[id]);
      if(isNaN(amount) || amount<=0) return;
      materials = materials.map(m=> m.id===id? {...m, stockQty: String(Math.max(0, (parseFloat(m.stockQty)||0) - amount))} : m);
      delete matStockAdjustDraft[id];
      saveJSON(STORE_KEYS.materials, materials);
      render();
    });
  });
}

function renderProductsTab(){
  const grouped = {};
  productCategoriesList.forEach(c=>{ grouped[c.id] = []; }); // همه دسته‌ها همیشه دیده می‌شوند، حتی وقتی هنوز محصولی ندارند
  products.forEach(p=>{
    const key = p.categoryId && categoryName(p.categoryId) ? p.categoryId : '__none__';
    (grouped[key] = grouped[key]||[]).push(p);
  });
  const keys = Object.keys(grouped).sort((a,b)=>{
    if(a==='__none__') return 1;
    if(b==='__none__') return -1;
    return categoryName(a).localeCompare(categoryName(b),'fa');
  });
  return `
    <h2 class="sec">دسته‌بندی‌ها</h2>
    <div class="box-gray" style="display:flex;gap:8px;margin-bottom:14px">

      const label = key==='__none__' ? 'بدون دسته‌بندی' : categoryName(key);

    });
  });

    products.push({id:Date.now().toString(), name, categoryId: newProductCategoryId||'', dimensions:'', contents:[], image:'', items:[], laborItems:[]});
    saveJSON(STORE_KEYS.products, products);
    newProductName = '';
    if(newProductCategoryId) expandedCategoryIds.add(newProductCategoryId); else expandedCategoryIds.add('__none__');

// شماره فاکتورهای دیگر همین مشتری که هنوز مانده یا اضافه‌پرداخت دارند (برای ارجاع در فاکتور و لیست)
function customerOpenInvoices(customerId, excludeInvId){
  if(!customerId) return [];
  return invoices
    .filter(i=> i.customerId===customerId && i.id!==excludeInvId && (i.status==='final'||i.status==='paid'))
    .map(i=>{ const t = computeInvoiceTotals(i); return {number:i.number, balance:t.balance, overpaid:t.overpaid}; })
    .filter(x=> x.balance>0 || x.overpaid>0);
}
function customerBalance(customerId){
  // بدهکاری = جمع مانده فاکتورهای صادرشده/تسویه‌شده متصل به این مشتری
  // بستانکاری = جمع واریزی‌های آزاد ثبت‌شده + جمع اضافه‌پرداخت‌های فاکتورها (پولی که مشتری بیشتر از فاکتور داده)
  const linkedInvoices = invoices.filter(i=>i.customerId===customerId && i.status!=='draft' && i.status!=='cancelled');
  // قبلاً computeInvoiceTotals برای هر فاکتور دوبار صدا زده می‌شد (یک بار برای debit، یک بار برای overpaidTotal)؛
  // یک‌بار محاسبه و استفاده مجدد، هزینه‌ی این تابع رو نصف می‌کنه — روی لیست فاکتورهای بلند محسوسه
  let debit = 0, overpaidTotal = 0;
  linkedInvoices.forEach(inv=>{
    const t = computeInvoiceTotals(inv);
    debit += t.balance;
    overpaidTotal += t.overpaid;
  });
  const credit = transactions.filter(t=>t.customerId===customerId && t.type==='credit').reduce((s,t)=>s+(parseFloat(t.amount)||0),0) + overpaidTotal;
  return { debit, credit, net: credit - debit }; // net>0 یعنی بستانکار، net<0 یعنی بدهکار
}
// نسخه‌ی حافظه‌دارِ customerBalance، فقط برای یک اجرای رندر (مثلاً یک بار renderInvoiceListTab) —
// وقتی چند فاکتور مال یک مشتری هستن، به‌جای اسکن دوباره‌ی کل آرایه‌ی invoices برای هرکدوم، یک بار حساب می‌شه
function customerBalanceMemoized(cache){
  return (customerId)=>{
    if(cache.has(customerId)) return cache.get(customerId);
    const v = customerBalance(customerId);
    cache.set(customerId, v);
    return v;
  };
}
// قدیمی‌ترین تاریخ یک فاکتور صادرشده/تسویه‌شده که هنوز مانده‌ی پرداخت‌نشده داره — برای این‌که بشه گفت
// «این بدهی از چند روز پیش مونده»، نه فقط این‌که «بدهکاره» بدون هیچ سابقه‌ی زمانی
function customerOldestUnpaidDate(customerId){
  const unpaid = invoices.filter(i=> i.customerId===customerId && i.status!=='draft' && i.status!=='cancelled' && computeInvoiceTotals(i).balance>0);
  if(unpaid.length===0) return null;
  return unpaid.reduce((min,i)=> (!min || i.date<min) ? i.date : min, null);
}

let suppView = 'list'; // 'list' | 'detail' | 'new'
let activeSupplierId = null;
let suppNewDraft = { name:'', phone:'' };
let purchaseDraft = { amount:'', paid:'', date: todayStr(), note:'' };

function blankSupplier(){ return { id: Date.now().toString()+Math.random().toString(36).slice(2), name:'', phone:'' }; }

// هزینه‌های اجرایی که روی فاکتورهای صادرشده به این اجاره‌دهنده/همکار وصل شده‌اند (فاکتور پیش‌نویس و لغوشده حساب نمی‌شود)
function supplierLinkedJobCosts(supplierId){
  const out = [];
  invoices.forEach(inv=>{
    if(inv.status!=='final' && inv.status!=='paid') return;
    (inv.jobCosts||[]).forEach(c=>{
      if(c.vendorId===supplierId && (parseFloat(c.amount)||0)>0) out.push({...c, invDate: inv.date, invNumber: inv.number, invId: inv.id});
    });
  });
  return out;
}
function supplierBalance(supplierId){
  const list = purchases.filter(p=>p.supplierId===supplierId);
  const linked = supplierLinkedJobCosts(supplierId);
  const totalAmount = list.reduce((s,p)=>s+(parseFloat(p.amount)||0),0) + linked.reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  const totalPaid = list.reduce((s,p)=>s+(parseFloat(p.paid)||0),0) + linked.filter(c=>c.paid).reduce((s,c)=>s+(parseFloat(c.amount)||0),0);
  return { totalAmount, totalPaid, debt: Math.max(0, totalAmount-totalPaid) };
}
// قدیمی‌ترین تاریخ یک خرید از این اجاره‌دهنده/همکار که هنوز کامل تسویه نشده — همون منطق customerOldestUnpaidDate،
// اینجا برعکسش: این بدهیِ ماست به اجاره‌دهنده/همکار، نه بدهیِ مشتری به ما
function supplierOldestUnpaidDate(supplierId){
  const unpaid = purchases.filter(p=> p.supplierId===supplierId && (parseFloat(p.amount)||0) > (parseFloat(p.paid)||0));
  const unpaidLinked = supplierLinkedJobCosts(supplierId).filter(c=>!c.paid).map(c=>({date:c.invDate}));
  const all = unpaid.concat(unpaidLinked);
  if(all.length===0) return null;
  return all.reduce((min,p)=> (!min || p.date<min) ? p.date : min, null);
}

function saveExpenseDraft(){
  const amt = parseFloat(expenseDraft.amount);
  if(!expenseDraft.categoryName.trim()){ alert('نام دسته‌بندی را وارد کنید'); return; }
  if(!amt || amt<=0){ alert('مبلغ را درست وارد کنید'); return; }
  if(!editingExpenseId && expenseDraft.invoiceId){
    const inv = invoices.find(i=>i.id===expenseDraft.invoiceId);
    if(!inv){ alert('فاکتور پیدا نشد'); return; }
    if(!Array.isArray(inv.jobCosts)) inv.jobCosts = [];
    inv.jobCosts.push({ id: Date.now().toString()+Math.random().toString(36).slice(2,6), kind: expenseDraft.jobKind||'other',
      title: [expenseDraft.categoryName.trim(), (expenseDraft.note||'').trim()].filter(Boolean).join(' — '), amount: String(amt), vendorId:'', paid:true });
    saveJSON(STORE_KEYS.invoices, invoices);
    alert('هزینه به فاکتور #' + invNumStr(inv.number) + ' اضافه شد و از سود آن کم می‌شود.' + (inv.status==='draft' ? '\n(این فاکتور هنوز پیش‌فاکتور است؛ بعد از صدور در گزارش‌ها هم حساب می‌شود.)' : ''));
    expenseDraft = blankExpenseDraft(expenseDraft.tag);
    return;

const BALANCE_STATUS_LABELS = { debtor:'بدهکار', creditor:'بستانکار', settled:'تسویه‌شده' };
const BALANCE_STATUS_COLORS = { debtor:'var(--gray)', creditor:'var(--red)', settled:'#1A7A3A' };

function getCombinedBalances(){
  const rows = [];
  customers.forEach(c=>{
    const bal = customerBalance(c.id);
    let status, amount;
    if(bal.net<0){ status='debtor'; amount=Math.abs(bal.net); }
    else if(bal.net>0){ status='creditor'; amount=bal.net; }
    else { status='settled'; amount=0; }
    rows.push({ name:c.name, type:'مشتری', status, amount });
  });
  suppliers.forEach(s=>{
    const bal = supplierBalance(s.id);
    let status, amount;
    if(bal.debt>0){ status='creditor'; amount=bal.debt; }
    else { status='settled'; amount=0; }
    rows.push({ name:s.name, type:'اجاره‌دهنده/همکار', status, amount });
  });
  rows.sort((a,b)=>{
    if(a.status==='settled' && b.status!=='settled') return 1;
    if(a.status!=='settled' && b.status==='settled') return -1;
    return b.amount - a.amount;
  });
  return rows;
}

function expenseMonthSummary(){
  const monthStart = jalaliMonthStartISO();
  const todayS = todayStr();
  const inMonth = expenses.filter(e=> e.date>=monthStart && e.date<=todayS);
  // مقادیر منفی احتمالی (مثلا از بک‌آپ دستکاری‌شده) نادیده گرفته می‌شوند چون «هزینه منفی» بی‌معنی است
  const safeAmt = e => Math.max(0, parseFloat(e.amount)||0);
  const business = inMonth.filter(e=>e.tag==='business').reduce((s,e)=>s+safeAmt(e),0);
  const personal = inMonth.filter(e=>e.tag==='personal').reduce((s,e)=>s+safeAmt(e),0);
  const byCategory = {};
  inMonth.forEach(e=>{ byCategory[e.categoryName] = (byCategory[e.categoryName]||0) + safeAmt(e); });
  const topCategories = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  return { business, personal, total: business+personal, topCategories };
}

// پیشنهاد درصد سربار بر اساس میانگین چند ماه گذشته:
// برای هر ماه = (هزینه‌های کسب‌وکار همان ماه) ÷ (مجموع قیمت تمام‌شده رکوردهای تب محاسبه در همان ماه) × ۱۰۰
// فقط ماه‌هایی که هم هزینه و هم حداقل یک رکورد دارند حساب می‌شوند؛ ماه‌های ناقص نادیده گرفته می‌شوند تا میانگین را خراب نکنند
function suggestOverheadPercent(monthsBack){
  monthsBack = monthsBack || 3;
  const now = new Date();
  const monthRatios = [];
  for(let i=0;i<monthsBack;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const start = d.toISOString().slice(0,10);
    const endD = new Date(d.getFullYear(), d.getMonth()+1, 0);
    const end = endD.toISOString().slice(0,10);
    const exp = expenses.filter(e=> e.tag==='business' && e.date>=start && e.date<=end)
      .reduce((s,e)=>s+Math.max(0,parseFloat(e.amount)||0),0);
    const recCost = records.filter(r=> r.date>=start && r.date<=end)
      .reduce((s,r)=>s+Math.max(0,parseFloat(r.totalCost)||0),0);
    if(exp>0 && recCost>0) monthRatios.push(exp/recCost*100);
  }
  if(monthRatios.length===0) return null;
  const avg = monthRatios.reduce((s,v)=>s+v,0)/monthRatios.length;
  return { percent: Math.round(avg*10)/10, monthsUsed: monthRatios.length };
}
// سربار = درصد ثابت از قیمت تمام‌شده همین محصول (مواد+دستمزد) — مستقل از تعداد فروش این ماه
function computeAutoOverhead(){
  const materialsCost = calc.items.reduce((s,it)=>{
    const mat = materials.find(m=>m.id===it.materialId);
    const qty = parseQty(it.qty);
    return s + (mat? mat.price*qty : 0);
  },0);
  const laborCost = calc.laborItems.reduce((s,l)=>s+laborItemCost(l),0);
  const baseCost = Math.max(0, materialsCost + laborCost);
  // درصد سربار هرگز منفی نیست — منفی شدن سربار یعنی کاهش قیمت تمام‌شده که بی‌معنی است
  const pct = Math.max(0, parseFloat(overheadPercent)||0);
  const perUnit = baseCost * (pct/100);
  return { baseCost, percent: pct, perUnit };
}

function renderExpListView(){

let chequeDraft = { direction:'receivable', amount:'', dueDate: todayStr(), personName:'', chequeNumber:'', bankName:'', note:'' };

function bindChequesEvents(){
  document.querySelectorAll('.cheque-dir-btn').forEach(el=>{
    el.addEventListener('click', e=>{ chequeDraft.direction = e.currentTarget.dataset.dir; render(); });
  });
  document.getElementById('chequePersonName')?.addEventListener('input', e=>{ chequeDraft.personName = e.target.value; });
  document.getElementById('chequeAmount')?.addEventListener('input', e=>{ chequeDraft.amount = e.target.value; });
  bindJalaliDateInput('chequeDueDate', iso=>{ chequeDraft.dueDate = iso; });
  document.getElementById('chequeNumber')?.addEventListener('input', e=>{ chequeDraft.chequeNumber = e.target.value; });
  document.getElementById('chequeBankName')?.addEventListener('input', e=>{ chequeDraft.bankName = e.target.value; });
  document.getElementById('chequeNote')?.addEventListener('input', e=>{ chequeDraft.note = e.target.value; });
  document.getElementById('chequeSubmitBtn')?.addEventListener('click', ()=>{
    const amount = parseFloat(chequeDraft.amount);
    if(!chequeDraft.personName.trim() || isNaN(amount) || amount<=0 || !chequeDraft.dueDate){
      alert('نام، مبلغ و تاریخ سررسید را وارد کن'); return;
    }
    if(editingChequeId){
      cheques = cheques.map(c=> c.id===editingChequeId? {...c, ...chequeDraft, amount}: c);
      editingChequeId = null;
    } else {
      cheques.push({ id:Date.now().toString(), ...chequeDraft, amount, status:'pending' });
    }
    saveJSON(STORE_KEYS.cheques, cheques);
    chequeDraft = { direction:'receivable', amount:'', dueDate: todayStr(), personName:'', chequeNumber:'', bankName:'', note:'' };
    render();
  });
  document.getElementById('chequeCancelBtn')?.addEventListener('click', ()=>{
    editingChequeId = null;
    chequeDraft = { direction:'receivable', amount:'', dueDate: todayStr(), personName:'', chequeNumber:'', bankName:'', note:'' };
    render();
  });
  document.querySelectorAll('.cheque-filter-btn').forEach(el=>{
    el.addEventListener('click', e=>{ chequeFilterStatus = e.currentTarget.dataset.status; render(); });
  });
  document.querySelectorAll('.cheque-mark').forEach(el=>{
    el.addEventListener('click', e=>{
      const id = e.currentTarget.dataset.id;
      const status = e.currentTarget.dataset.status;
      cheques = cheques.map(c=> c.id===id? {...c, status}: c);
      saveJSON(STORE_KEYS.cheques, cheques);
      render();
    });
  });
  document.querySelectorAll('.cheque-edit').forEach(el=>{
    el.addEventListener('click', e=>{
      const c = cheques.find(x=>x.id===e.currentTarget.dataset.id);
      if(!c) return;
      editingChequeId = c.id;
      chequeDraft = { direction:c.direction, amount:String(c.amount), dueDate:c.dueDate, personName:c.personName||'', chequeNumber:c.chequeNumber||'', bankName:c.bankName||'', note:c.note||'' };
      render();
    });
  });
  document.querySelectorAll('.cheque-delete').forEach(el=>{
    el.addEventListener('click', e=>{
      if(!confirm('این چک حذف شود؟')) return;
      const id = e.currentTarget.dataset.id;
      const rowEl = e.currentTarget.closest('[data-row-id]');
      animateAndRemoveRow(rowEl, ()=>{
        cheques = cheques.filter(c=>c.id!==id);
        saveJSON(STORE_KEYS.cheques, cheques);
        render();
      });
    });
  });
}

// ===== تب گزارش =====
let reportPeriod = 'month'; // week | month | q3 | q6 | year
let reportStartDate = todayStr();

function periodRange(period, refDateStr){
  // بازه از گذشته تا تاریخ مرجع (پیش‌فرض امروز) محاسبه می‌شود، نه برعکس
  const end = new Date(refDateStr || reportStartDate);
  let start;
  if(period==='week'){
    start = new Date(end);
    start.setDate(start.getDate()-7);
  } else {
    // برای ماهانه/سه‌ماهه/شش‌ماهه/سالانه، از ابتدای همان ماهِ N ماه قبل شروع می‌شود
    const monthsBack = period==='month'?1 : period==='q3'?3 : period==='q6'?6 : period==='year'?12 : 1;
    start = new Date(end.getFullYear(), end.getMonth()-monthsBack, 1);
  }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

// درآمد نهایی (بعد از تخفیف) این فاکتور رو بر اساس سهم هر فضای کاری از جمع ردیف‌ها تقسیم می‌کنه —
// برای فاکتورهای تک‌نوع همون مبلغ کامل به همون نوع می‌ره؛ برای چند‌نوع، تخفیف به نسبت بین‌شون پخش می‌شه
function invoiceRevenueByActivity(inv){
  const t = computeInvoiceTotals(inv);
  const result = Object.fromEntries(WORKSPACES.map(w=>[w.key,0]));
  const scale = t.linesTotal>0 ? (t.netTotal / t.linesTotal) : 0; // درآمد بدون مالیات
  inv.lines.forEach(l=>{
    const type = l.activityType || inv.activityType || 'photo';
    const lineRevenue = invLineUnitPrice(l)*parseQty(l.qty);
    if(result[type]===undefined) result[type]=0;
    result[type] += lineRevenue*scale;
  });
  return result;
}
function reportData(period){
  const {start, end} = periodRange(period);
  const counted = invoices.filter(inv=> (inv.status==='final' || inv.status==='paid') && inv.date>=start && inv.date<=end);
  const ws = Object.fromEntries(WORKSPACES.map(w=>[w.key,0]));
  let grossProfit = 0;
  counted.forEach(inv=>{
    const r = invoiceRevenueByActivity(inv);
    WORKSPACES.forEach(w=>{ ws[w.key] += r[w.key]||0; });
    grossProfit += computeInvoiceTotals(inv).profitAfterDiscount;
  });
  // فقط هزینه‌های «کسب‌وکار» از سود کم می‌شن، نه هزینه‌های شخصی — چون هزینه شخصی ربطی به سودآوری کار نداره
  const businessExpenses = expenses.filter(e=> e.tag==='business' && e.date>=start && e.date<=end)
    .reduce((s,e)=>s+(parseFloat(e.amount)||0), 0);
  const netProfit = grossProfit - businessExpenses;
  // دریافتی‌ها (نقدی) بر اساس نوع، با تاریخ خود واریزی
  const cash = { deposit:0, installment:0, final:0, extra:0, unknown:0 };
  invoices.filter(i=> i.status==='final' || i.status==='paid').forEach(inv=>{
    (inv.payments||[]).forEach(p=>{
      if(p.date>=start && p.date<=end){ const k = cash[p.kind]!==undefined ? p.kind : 'unknown'; cash[k] += parseFloat(p.amount)||0; }
    });
  });
  const vatCollected = counted.reduce((a,inv)=> a + computeInvoiceTotals(inv).vat, 0);
  let depreciation = 0;
  counted.forEach(inv=> (inv.jobCosts||[]).forEach(c=>{ if(c.kind==='depreciation') depreciation += parseFloat(c.amount)||0; }));
  let itemCost = 0, jobCosts = 0; const jobByKind = {};
  counted.forEach(inv=>{ const bd = invoiceCostBreakdown(inv); itemCost += bd.itemCost; jobCosts += bd.jobTotal; Object.entries(bd.byKind).forEach(([k,v])=>{ jobByKind[k] = (jobByKind[k]||0)+v; }); });
  return { cash, vatCollected, depreciation, itemCost, jobCosts, jobByKind, ...ws, total: WORKSPACES.reduce((a,w)=>a+ws[w.key],0), count: counted.length, start, end, grossProfit, businessExpenses, netProfit };
}

const REPORT_PERIOD_LABELS = { week:'هفتگی', month:'ماهانه', q3:'سه‌ماهه', q6:'شش‌ماهه', year:'سالانه' };

function customerReportData(){
  return customers.map(c=>{
    const counted = invoices.filter(i=> i.customerId===c.id && (i.status==='final' || i.status==='paid'));
    const totalPurchase = counted.reduce((s,inv)=> s + computeInvoiceTotals(inv).grandTotal, 0);

    return { id:c.id, name:c.name, totalPurchase, invoiceCount: counted.length, debtRemaining: bal.net<0? Math.abs(bal.net) : 0, creditRemaining: bal.net>0? bal.net : 0 };
  }).sort((a,b)=> b.totalPurchase - a.totalPurchase);
}

// نزدیک‌ترین تاریخ سررسید آینده برای یک «روز ثابت ماهانه» (مثلا همیشه روز ۵) را برمی‌گرداند
// اگر آن روز در همین ماه هنوز نگذشته باشد همین ماه، وگرنه ماه بعد
function nextDueDateForDay(day){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), todayDate = now.getDate();
  let targetMonth = m, targetYear = y;
  if(day < todayDate){ targetMonth = m+1; }
  const lastDayOfTargetMonth = new Date(targetYear, targetMonth+1, 0).getDate();
  const safeDay = Math.min(day, lastDayOfTargetMonth); // برای ماه‌هایی که آن روز را ندارند (مثلا ۳۱ در بهمن)
  const d = new Date(targetYear, targetMonth, safeDay);
  return d.toISOString().slice(0,10);
}
function getAllReminders(){
  const list = [];
  invoices.forEach(inv=>{
    if(inv.status==='cancelled') return;
    const custName = inv.customerName || 'بدون نام';
    if(inv.deliveryDueDate && inv.projectStatus!=='delivered'){
      list.push({ id:'deliv-'+inv.id, date: inv.deliveryDueDate, type:'تحویل', text:`موعد تحویل فاکتور #${inv.number||'-'} — ${custName}`, invoiceId: inv.id, source:'auto', done:false });
    }
    if(inv.validTo && inv.status==='final'){
      list.push({ id:'valid-'+inv.id, date: inv.validTo, type:'اعتبار', text:`پایان اعتبار فاکتور #${inv.number||'-'} — ${custName}`, invoiceId: inv.id, source:'auto', done:false });
    }
  });
  expenseCategories.forEach(c=>{
    if(!c.dueDay) return;
    const dueDate = nextDueDateForDay(c.dueDay);
    list.push({ id:'expcat-'+c.id, date: dueDate, type:'هزینه ثابت', text:`سررسید ${c.name}${c.defaultAmount? ' — '+fmt(c.defaultAmount)+' ت':''}`, invoiceId:null, source:'auto', done:false });
  });
  // بدهی معوق مشتری — اگه یه مشتری بیش از ۳۰ روزه یه فاکتور پرداخت‌نشده داره، یادآوری پیگیری خودکار ساخته می‌شه؛
  // چون این زنده از روی مانده‌حساب حساب می‌شه، به‌محض تسویه شدن بدهی، خودش از لیست یادآوری‌ها محو می‌شه
  const todayS0 = todayStr();
  customers.forEach(c=>{
    const bal = customerBalance(c.id);
    if(bal.net>=0) return; // فقط مشتری‌های بدهکار
    const oldestDate = customerOldestUnpaidDate(c.id);
    if(!oldestDate) return;
    const daysPast = Math.floor((new Date(todayS0) - new Date(oldestDate)) / 86400000);
    if(daysPast>=30){
      list.push({ id:'debt-'+c.id, date: oldestDate, type:'بدهی معوق', text:`${c.name} — ${toPersianDigits(daysPast)} روزه بدهکاره (${fmt(Math.abs(bal.net))} ت) — پیگیری کن`, invoiceId:null, source:'auto', done:false });
    }
  });
  // بدهی معوق ما به اجاره‌دهنده/همکار — همون منطق برعکس؛ این‌بار خودمون بدهکاریم، نه مشتری
  suppliers.forEach(s=>{
    const bal = supplierBalance(s.id);
    if(bal.debt<=0) return;
    const oldestDate = supplierOldestUnpaidDate(s.id);
    if(!oldestDate) return;
    const daysPast = Math.floor((new Date(todayS0) - new Date(oldestDate)) / 86400000);
    if(daysPast>=30){
      list.push({ id:'suppdebt-'+s.id, date: oldestDate, type:'بدهی به اجاره‌دهنده/همکار', text:`${toPersianDigits(daysPast)} روزه به ${s.name} بدهکاریم (${fmt(bal.debt)} ت)`, invoiceId:null, source:'auto', done:false });
    }
  });
  // کمبود موجودی مواد اولیه — فقط برای موادی که خودت آستانه‌ی هشدار براشون تعیین کردی (تا برای موادی که
  // اصلاً موجودیشون رو دنبال نمی‌کنی، شلوغ و بی‌مورد هشدار نده)
  materials.forEach(m=>{
    const threshold = parseFloat(m.lowStockThreshold)||0;
    if(threshold<=0) return;
    const stock = parseFloat(m.stockQty)||0;
    if(stock<=threshold){
      list.push({ id:'lowstock-'+m.id, date: todayS0, type:'کمبود موجودی', text:`موجودی ${m.name} کم شده — ${toPersianDigits(stock)} ${m.unit} مونده`, invoiceId:null, source:'auto', done:false });
    }
  });
  // سررسید چک‌های در انتظار — هم دریافتی هم پرداختی؛ مثل بقیه یادآورهای خودکار، با تاریخ سررسیدِ خودِ چک ثبت
  // می‌شه و فیلتر «۷ روز آینده» طبیعتاً نشونش می‌ده یا مخفی نگهش می‌داره
  cheques.forEach(c=>{
    if(c.status!=='pending') return;
    const dirLabel = c.direction==='receivable' ? 'دریافتی' : 'پرداختی';
    list.push({ id:'cheque-'+c.id, date: c.dueDate, type:'سررسید چک', text:`چک ${dirLabel} ${c.personName||''} — ${fmt(c.amount)} ت`, invoiceId:null, source:'auto', done:false });
  });
  editProjects().forEach(inv=>{
    if(!inv.editorId || !inv.editDue) return;
    list.push({ id:'edit-'+inv.id, date: inv.editDue, type:'ادیت', text:`موعد ادیت فاکتور #${invNumStr(inv.number)} ${inv.customerName||''} — ${staffName(inv.editorId)}`, invoiceId: inv.id, source:'auto', done:false });
  });
  invoices.forEach(inv=>{
    if(inv.status!=='final' || !(inv.paymentPlan||[]).length) return;
    planStatus(inv).forEach(x=>{
      if(x.state==='paid' || x.remaining<=0 || !planRowIsDue(inv, x.row)) return;
      list.push({ id:'plan-'+inv.id+'-'+x.row.id, date: (x.row.trigger==='date' && x.row.dueDate) ? x.row.dueDate : todayStr(), type:'قسط فاکتور', text:`قسط «${x.row.label||'مرحله'}» فاکتور #${invNumStr(inv.number)} ${inv.customerName||''} — ${fmt(x.remaining)} ت`, invoiceId:inv.id, source:'auto', done:false });
    });
  });
  invoices.forEach(inv=>{
    const fa = inv.fileArchive;
    if(inv.status==='cancelled' || !fa || fa.rawStatus!=='kept' || !fa.rawKeepUntil) return;
    list.push({ id:'raw-'+inv.id, date:fa.rawKeepUntil, type:'آرشیو', text:`پایان نگهداری فایل خام ${inv.customerName||''}${fa.media? ' — '+fa.media : ''}`, invoiceId:inv.id, source:'auto', done:false });
  });
  bookings.forEach(b=>{
    if(!bkIsOpen(b)) return;
    list.push({ id:'bk-'+b.id, date:b.date, type:'آفیش', text:`آفیش ${b.title||b.customerName||''} — ساعت ${toPersianDigits(b.start)} (${BOOKING_PLACES[b.place]||''})`, invoiceId:b.invoiceId||null, source:'auto', done:false });
  });
  manualReminders.forEach(r=>{
    if(r.done) return;
    list.push({ id:r.id, date:r.date, type:'یادآوری', text:r.text, invoiceId: r.invoiceId||null, source:'manual', done:false });
  });
  return list.sort((a,b)=> a.date.localeCompare(b.date));
}

function addManualReminder(date, text, invoiceId){
  if(!date || !text.trim()) return;
  manualReminders = [...manualReminders, { id: Date.now().toString()+Math.random().toString(36).slice(2), date, text: text.trim(), invoiceId: invoiceId||null, done:false }];

}

  manualReminders = manualReminders.filter(r=>r.id!==id);
  saveManualReminders();
}

function reportBarChart(bars){
  // bars: [{label, value, color}]
  const max = Math.max(...bars.map(b=>b.value), 1);
  const barW = 60, gap = 34, h = 140;
  const w = bars.length*barW + (bars.length+1)*gap;
  const startX = gap;
  const barsSvg = bars.map((b,i)=>{
    const x = startX + i*(barW+gap);
    const bh = Math.round((b.value/max)*100);
    return `
    <rect x="${x}" y="${h-20-bh}" width="${barW}" height="${bh}" fill="${b.color}" rx="3"/>
    <text x="${x+barW/2}" y="${h-20-bh-6}" text-anchor="middle" font-size="10" fill="#000" font-weight="700">${fmt(b.value)}</text>
    <text x="${x+barW/2}" y="${h-4}" text-anchor="middle" font-size="10" fill="#6B7075">${b.label}</text>`;
  }).join('');
  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:360px;display:block;margin:10px auto">
    <line x1="10" y1="${h-20}" x2="${w-10}" y2="${h-20}" stroke="#ddd" stroke-width="1"/>
    ${barsSvg}
  </svg>`;
}

// و بعد callback (که splice+render واقعیه) صدا زده می‌شه — تا حذف ردیف به‌جای پرش ناگهانی، نرم به‌نظر بیاد
function animateAndRemoveRow(el, onDone){
  if(!el){ onDone(); return; }
  let done = false;
  const finish = ()=>{ if(done) return; done = true; onDone(); };
  el.classList.add('row-removing');
  el.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 220); // اگه transitionend به هر دلیلی شلیک نشد (مثلا prefers-reduced-motion)، خودش انجام بشه
}

const FS_SUPPORTED = typeof window!=='undefined' && 'showDirectoryPicker' in window;
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('studioFS', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);

}
let downloadDirHandle = null; // در حافظه؛ اول هر بار از IndexedDB لود می‌شود
let downloadDirName = loadJSON(STORE_KEYS.downloadDirName, '');
async function ensureDownloadDirHandle(){
  if(!FS_SUPPORTED) return null;
  if(downloadDirHandle){
    if(await downloadDirHandle.queryPermission({mode:'readwrite'}) === 'granted') return downloadDirHandle;
  }
  try{
    const stored = await idbGet('downloadDir');
    if(!stored) return null;
    const perm = await stored.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ downloadDirHandle = stored; return stored; }
    if(perm === 'prompt'){
      const req = await stored.requestPermission({mode:'readwrite'});
      if(req === 'granted'){ downloadDirHandle = stored; return stored; }
    }
  }catch(e){ /* هندل نامعتبر شده یا دسترسی لغو شده — کاربر باید دوباره پوشه را انتخاب کند */ }
  return null;
}
async function pickDownloadFolder(){
  if(!FS_SUPPORTED){ alert('این قابلیت فقط توی کروم دسکتاپ پشتیبانی می‌شه'); return; }

    const handle = await window.showDirectoryPicker();
    downloadDirHandle = handle;
    downloadDirName = handle.name;

}
function clearDownloadFolder(){
  downloadDirHandle = null;

  render();
}
// blob رو یا مستقیم توی پوشه انتخاب‌شده ذخیره می‌کنه، یا اگه پوشه‌ای تعریف نشده/پشتیبانی نمی‌شه، دانلود معمولی مرورگر رو انجام می‌ده
async function saveBlobSmart(blob, filename){
  const dir = await ensureDownloadDirHandle();
  if(dir){
    try{
      const fileHandle = await dir.getFileHandle(filename, {create:true});
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    }catch(e){ /* اگه ذخیره مستقیم شکست خورد، برو سراغ دانلود معمولی */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return false;
}
async function downloadBackup(){
  const data = { materials, products, productCategoriesList, records, invoices, invoiceSeq, customers, transactions, overheadPerUnit, overheadPercent, suppliers, purchases, manualReminders, expenses, expenseCategories, bankInfo, brandInfo, themeSettings, bookings, bookingResources, equipment, staff, tariff, contracts, contractTpl, cheques, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const now = new Date();
  const stamp = todayStr() + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0');
  const filename = 'studio-backup-' + stamp + '.json';
  const savedDirect = await saveBlobSmart(blob, filename);
  alert(savedDirect ? ('بک‌آپ در پوشه «'+downloadDirName+'» با نام '+filename+' ذخیره شد') : ('بک‌آپ با نام '+filename+' دانلود شد'));
}

function mergeArrayById(local, incoming){
  const map = new Map();
  (local||[]).forEach(item=>{ if(item && item.id!=null) map.set(item.id, item); });

  return Array.from(map.values());
}
